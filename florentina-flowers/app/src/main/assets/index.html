function checkout(){if(!cart.length){alert(t("emptyCart"));return}let ids=["email","recipient","phone","country","city","zip","address","date"];if(ids.some(id=>!document.getElementById(id).value.trim())){alert(t("required"));return}let c={};cart.forEach(v=>c[v]=(c[v]||0)+1);let items=Object.entries(c).map(([v,q])=>v+":"+q).join(",");let n=splitName(recipient.value);let p=new URLSearchParams();p.set("checkout[email]",email.value.trim());p.set("checkout[shipping_address][first_name]",n.first);p.set("checkout[shipping_address][last_name]",n.last);p.set("checkout[shipping_address][address1]",address.value.trim());p.set("checkout[shipping_address][city]",city.value.trim());p.set("checkout[shipping_address][country]",country.value.trim());p.set("checkout[shipping_address][zip]",zip.value.trim());p.set("attributes[Recipient phone]",phone.value.trim());p.set("attributes[Delivery date]",date.value);p.set("attributes[Source]","Florentina Flowers Android v1.4");if(message.value.trim())p.set("note",message.value.trim());let u="https://"+SHOP+"/cart/"+items+"?"+p.toString();if(window.Android&&Android.openCheckout)Android.openCheckout(u);else location.href=u}
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),1500)}
applyText();renderCats();renderProducts();renderFavorites();save();fetch("https://api.frankfurter.app/latest?from=RON&to=EUR").then(r=>r.json()).then(j=>{if(j&&j.rates&&j.rates.EUR){liveEurRate=j.rates.EUR;refreshMoney()}}).catch(()=>{});setTimeout(()=>splash.classList.add("hide"),850);
</script>
