plugins { id 'com.android.application' }

android {
    namespace 'com.floryflowers.app'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('flory-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.floryflowers.app"
        minSdk 24
        targetSdk 35
        versionCode 25
        versionName "1.25"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}