name: Build Scalp Atlas 474 fixed-demo recovery with luminous brain

on:
  push:
    branches: [feature/scalpatlas-history-timeout441, fix/scalpatlas-closed-history-loop, fix/scalpatlas-readonly-broker-window443, fix/scalpatlas-repeat-settlement444, fix/scalpatlas-verified-open-closed-bridge445, fix/scalpatlas-closed-row-ocr446, fix/scalpatlas-history-header-dock447, fix/scalpatlas-sequential-demo448, fix/scalpatlas-early-history-dock449, fix/scalpatlas-simple-shock-demo450, fix/scalpatlas-martingale-overlay451, fix/scalpatlas-simple-engine452, fix/scalpatlas-fresh-bip-auto-demo453, fix/scalpatlas-history-rearm-demo454, fix/scalpatlas-open-tab-visual-proof455, fix/scalpatlas-physical-history-nav456, fix/scalpatlas-return-to-chart457, fix/scalpatlas-rearm-open-tab458, fix/scalpatlas-open-tab-accessibility459, fix/scalpatlas-chart-only462, fix/scalpatlas-passive-proof463, fix/scalpatlas-demo-expiry-pilot464, fix/scalpatlas-demo-continuous465, fix/scalpatlas-confirmed-sell-pullback466, feature/scalpatlas-rotating-brain467, fix/scalpatlas-rollback-473-brain, fix/scalpatlas-474-demo-migration]
    paths:
      - '.github/workflows/build-native-robot-safe-preflight-379.yml'
      - '.github/native-overlay/TouchTestActivity.kt'
      - '.github/native-overlay/TouchTestService.kt'
      - '.github/native-overlay/touch_test_accessibility.xml'
      - '.github/templates/TouchPracticePanel.tsx'
      - 'scalp-atlas-new/shockDetector.ts'
      - 'scalp-atlas-new/shockNativeEngine.ts'
      - 'scalp-atlas-new/analysisEngine.ts'
      - '.github/templates/ScalpAtlasIntegratedAppV042.tsx'
      - '.github/templates/ScalpAtlasOneButtonOverlayApp.tsx'
      - '.github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx'
      - '.github/templates/ScalpAtlasAnalysisEngineV0416.ts'
      - '.github/templates/ScalpAtlasLocalizationV0418.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.native.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.web.ts'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.web.tsx'
      - '.github/native-overlay/**'
      - '.github/scripts/patch_live_v327_closed_candles.py'
      - '.github/scripts/verify_live_v327_gate.py'
      - '.github/scripts/patch_live_v327_bell_toggle.py'
      - '.github/scripts/patch_live_v328_geometry.py'
      - '.github/scripts/test_live_candle_evidence.mjs'
      - '.github/scripts/test_live_confirmation_freshness.mjs'
      - '.github/scripts/test_live_wick_rejection_v323.mjs'
      - '.github/scripts/test_pair_adaptive_live.mjs'
      - '.github/scripts/test_live_journal_freshness_v324.mjs'
      - '.github/scripts/test_live_trend_pullback_m10.mjs'
      - '.github/scripts/test_shock_broker_capture.mjs'
  workflow_dispatch:

concurrency:
  group: scalp-atlas-g24-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reuse existing overlay source without conflicting legacy patch
        run: |
          set -e
          test -s .github/native-overlay/ScalpOverlayService.kt
          test -s .github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx
          echo "Using current generic broker overlay sources; old Pocket Option-only patch skipped."

      - name: Validate current SHOCK source without legacy UI patches
        run: |
          set -e
          test -s scalp-atlas-new/shockNativeEngine.ts
          test -s .github/native-overlay/ScalpOverlayService.kt
          grep -q 'shockSameCandle' .github/native-overlay/ScalpOverlayService.kt

      - name: Preserve already-integrated Android overlay
        run: |
          set -e
          test -s .github/native-overlay/ScalpOverlayService.kt
          grep -q 'bellEnabled' .github/native-overlay/ScalpOverlayService.kt

      - name: Restore exact Clean View UI and motor
        run: |
          set -e
          cp .github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx scalp-atlas-new/LiveAnalysisApp.tsx
          cp .github/templates/ScalpAtlasOneButtonOverlayApp.tsx scalp-atlas-new/App.tsx
          cp .github/templates/TouchPracticePanel.tsx scalp-atlas-new/TouchPracticePanel.tsx
          cp .github/templates/ScalpAtlasLocalizationV0418.ts scalp-atlas-new/localization.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.ts scalp-atlas-new/ocrAdapter.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.native.ts scalp-atlas-new/ocrAdapter.native.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.web.ts scalp-atlas-new/ocrAdapter.web.ts
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx scalp-atlas-new/AnalyzerBridge.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx scalp-atlas-new/AnalyzerBridge.native.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.web.tsx scalp-atlas-new/AnalyzerBridge.web.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('scalp-atlas-new/app.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          expo=cfg['expo']
          expo['name']='SCALP ATLAS LIVE'
          expo['slug']='scalp-atlas-live'
          expo['version']='3.2.32'
          expo['orientation']='default'
          expo['android']['package']='com.scalpatlas.livealerts'
          expo['android']['versionCode']=474
          expo['ios']['bundleIdentifier']='com.scalpatlas.livealerts'
          permissions=expo['android'].setdefault('permissions',[])
          permissions[:]=[v for v in permissions if v!='CAMERA']
          supported=['ro','en','de','es','fr','it','pt','nl','pl','uk','ru','tr','el','hu','cs','sk','bg','sr','hr','sl','ar','he','zh','ja','ko','hi']
          plugins=expo.setdefault('plugins',[])
          # This release analyzes the shared screen, never the camera.
          plugins[:]=[p for p in plugins if not (p=='expo-camera' or (isinstance(p,list) and p and p[0]=='expo-camera'))]
          plugins[:]=[p for p in plugins if not (p=='expo-localization' or (isinstance(p,list) and p and p[0]=='expo-localization'))]
          plugins.append(['expo-localization',{'supportedLocales':{'ios':supported,'android':supported},'supportsRTL':True,'forcesRTL':False}])
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Update old UI labels without changing design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scalp-atlas-new/LiveAnalysisApp.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('PESTE POCKET OPTION','PESTE ORICE BROKER')
          s=s.replace('Pocket Option','brokerul ales')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify guide-free one-phone entry screen
        run: |
          set -e
          grep -q 'SUPRAPUNERE LIVE' scalp-atlas-new/App.tsx
          grep -q 'NativeModules.ScalpOverlay.startOverlayMode' scalp-atlas-new/App.tsx
          grep -Fq 'NativeModules.ScalpOverlay.getBuildInfo' scalp-atlas-new/App.tsx
          grep -Fq '{installedBuild}' scalp-atlas-new/App.tsx
          grep -Fq '{liveDiagnostics}' scalp-atlas-new/App.tsx
          grep -Fq 'NativeModules.ScalpOverlay' scalp-atlas-new/App.tsx
          ! grep -Eq 'showGuide|Ghid|guideQuick|CameraView' scalp-atlas-new/App.tsx
          ! grep -q 'LiveAnalysisApp' scalp-atlas-new/App.tsx
          grep -q "expo-camera" scalp-atlas-new/package.json || true

      - name: Validate SHOCK source availability
        run: |
          test -s scalp-atlas-new/shockDetector.ts
          test -s scalp-atlas-new/shockLiveSession.ts
          test -s .github/native-overlay/ScalpOverlayService.kt

      - name: Verify Android overlay source
        run: |
          test -s .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'dp(176)' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'fun applyCompactMode()' .github/native-overlay/ScalpOverlayService.kt
          grep -q 'Închide suprapunerea și oprește LIVE' .github/native-overlay/ScalpOverlayService.kt
          ! grep -q 'text = "Scalp Atlas 3.2.7"' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'setOnClickListener { stopSelf() }' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'reactContext.stopService(intent)' .github/native-overlay/ScalpOverlayModule.kt
          grep -Fq 'PendingIntent.getService' .github/native-overlay/ScalpOverlayService.kt

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: |
          npm install
          npx expo install expo-camera expo-audio expo-haptics expo-localization @react-native-async-storage/async-storage expo-ocr-kit react-native-webview
          npm install tesseract.js

      - name: Generate 2.3-second high and distinct BUY and SELL beeps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,struct,wave
          assets=Path('scalp-atlas-new/assets'); assets.mkdir(parents=True,exist_ok=True)
          rate=44160; duration=2.3; amp=.36
          for name,freq in [('buy-alert.wav',1220.0),('sell-alert.wav',980.0)]:
              frames=bytearray()
              for i in range(int(rate*duration)):
                  t=i/rate
                  fade=min(1.0,t/.025,(duration-t)/.15)
                  sample=int(32767*amp*max(0.0,fade)*math.sin(2*math.pi*freq*t))
                  frames+=struct.pack('<h',sample)
              with wave.open(str(assets/name),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(frames)
          PY

      - name: Verify both alert durations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import wave
          for filename in ['buy-alert.wav', 'sell-alert.wav']:
              p=Path('scalp-atlas-new/assets')/filename
              with wave.open(str(p), 'rb') as wav:
                  assert wav.getframerate()==44160, 'bad beep sample rate'
                  seconds=wav.getnframes()/wav.getframerate()
                  assert 2.25 <= seconds <= 2.35, f'Wrong beep length {filename}: {seconds}'
                  print(filename, round(seconds,2), 'seconds')
          PY

      - name: Generate launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Validate isolated touch practice panel
        run: |
          test -s scalp-atlas-new/TouchPracticePanel.tsx
          ! grep -Fq "TouchPracticePanel" scalp-atlas-new/App.tsx
          grep -Fq "onClose" scalp-atlas-new/TouchPracticePanel.tsx
          grep -Fq "Doar demonstrație locală" scalp-atlas-new/TouchPracticePanel.tsx

      - name: Verify 420 no permanent DEMO order lock from a read-only preflight failure
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          T=.github/native-overlay/TouchTestService.kt
          grep -Fq 'val latestPreflight = try {' "$O"
          grep -Fq 'TouchTestService.preflightOneDollarDemoOrder(' "$O"
          grep -Fq 'if (!latestPreflight.startsWith("PREGĂTIT AUTO DEMO")) {' "$O"
          grep -Fq 'PRECHECK_NO_GESTURE:' "$T"
          grep -Fq 'if (result.startsWith("PRECHECK_NO_GESTURE:")) {' "$O"
          grep -Fq 'cleared && tradePositionGate.cancelBeforeDispatch()' "$O"
          grep -Fq 'tradePositionGate.uncertainResult()' "$O"
          grep -Fq 'autoDemoLockedAt = lockedAt' "$O"
          grep -Fq 'TouchTestService.priorDemoGestureCooldownComplete()' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          t=Path('.github/native-overlay/TouchTestService.kt').read_text()
          order=s[s.index('} else if (newShock) {'):s.index('      setPulseRing(activeSignal)',s.index('} else if (newShock) {'))]
          assert order.index('val latestPreflight = try {') < order.index('tradePositionGate.beginAttempt()')
          assert order.index('tradePositionGate.beginAttempt()') < order.index('putBoolean("attempted", true)')
          assert order.index('putBoolean("attempted", true)') < order.index('TouchTestService.pressAutoOneDollarDemoOrderOnce(')
          fn=t[t.index('fun pressAutoOneDollarDemoOrderOnce('):t.index('fun previewOneDollarDemoOrder(',t.index('fun pressAutoOneDollarDemoOrderOnce('))]
          assert fn.count('PRECHECK_NO_GESTURE:') >= 4
          assert fn.index('PRECHECK_NO_GESTURE:') < fn.index('pressAnyPairDemoBuyOnce')
          assert 'pressAnyPairDemoSellOnce' in fn
          print('Safe preflight -> persist -> gesture ordering verified')
          PY

      - name: Verify 420 persistent history reason does not change execution safety
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'lastAutoDemoHistoryNavStatus = if (historyNavStalled431)' "$O"
          grep -Fq 'lastAutoDemoHistoryNavStatusAt = nowElapsed' "$O"
          grep -Fq 'lastAutoDemoHistoryNavStatus.isNotBlank() &&' "$O"
          grep -Fq 'TouchTestService.priorDemoGestureCooldownComplete()' "$O"
          grep -Fq 'tradePositionGate.brokerVerifiedEmptyDemoReview(true)' "$O"
          grep -Fq 'TouchTestService.pressAutoOneDollarDemoOrderOnce(' "$O"
          grep -Fq 'activeStrategy == "SHOCK" &&' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Verify 420 safe automatic read-only history navigation before rearming
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          T=.github/native-overlay/TouchTestService.kt
          grep -Fq 'activeDemoHistoryNodes(' "$T"
          grep -Fq 'if (!BrokerAdapterRegistry.hasDemoExecutor(pkg)) return null' "$T"
          grep -Fq 'svc.rootInActiveWindow ?: return null' "$T"
          grep -Fq 'if (seenReal || (!seenDemo && !cachedDemoVerifiedOnChart)) return null' "$T"
          grep -Fq 'clickExactDemoNavigationLabel(' "$T"
          grep -Fq 'advanceDemoHistoryReviewNavigation(' "$O"
          grep -Fq 'returnToDemoChartAfterVerifiedEmptyReview(' "$O"
          grep -Fq 'AccessibilityService.GLOBAL_ACTION_BACK' "$T"
          grep -Fq 'demoEmptyReviewReads >= 2' "$O"
          grep -Fq 'TouchTestService.priorDemoGestureCooldownComplete()' "$O"
          grep -Fq 'tradePositionGate.brokerVerifiedEmptyDemoReview(true)' "$O"
          grep -Fq 'activeStrategy == "SHOCK" &&' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Verify 420 five-minute wait, two positive zero-open reads and one SHOCK-only DEMO attempt
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          T=.github/native-overlay/TouchTestService.kt
          grep -Fq 'TouchTestService.priorDemoGestureCooldownComplete()' "$O"
          grep -Fq 'elapsed >= 5 * 60_000L' "$T"
          grep -Fq 'val verifiedDemoReview = demoVisibleNow || cachedDemoReview' "$O"
          grep -Fq 'ocrVerifiedEmptyOpenTab = ocrCurrent' "$O"
          grep -Fq 'demoEmptyReviewReads = 1' "$O"
          grep -Fq 'tick - demoEmptyReviewFirstAt >= 2_000L' "$O"
          grep -Fq 'tick - demoEmptyReviewFirstAt > 20_000L' "$O"
          grep -Fq 'tradePositionGate.brokerVerifiedEmptyDemoReview(true)' "$O"
          grep -Fq 'val newShock = activeSignal != "NONE" &&' "$O"
          grep -Fq 'activeStrategy == "SHOCK" &&' "$O"
          grep -Fq 'tradePositionGate.beginAttempt()' "$O"
          grep -Fq 'autoDemoSessionConsumed = true // only a persisted attempt consumes session' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Verify 420 DEMO auto order depends on confirmed SHOCK and broker, not bell preference
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          T=.github/native-overlay/TouchTestService.kt
          ! grep -Fq '!tfReady || !bellEnabled' "$O"
          ! grep -Fq 'brokerConnected && bellEnabled' "$O"
          ! grep -Fq 'uiClosed || !TouchTestService.ready() || !bellEnabled' "$O"
          grep -Fq 'val newShock = activeSignal != "NONE" &&' "$O"
          grep -Fq 'activeStrategy == "SHOCK" &&' "$O"
          grep -Fq 'lastConfirmedShockPercent > SHOCK_MIN_DEPTH' "$O"
          grep -Fq 'tradePositionGate.beginAttempt()' "$O"
          grep -Fq 'TouchTestService.preflightOneDollarDemoOrder(pair)' "$O"
          grep -Fq 'TouchTestService.pressAutoOneDollarDemoOrderOnce(' "$O"
          grep -Fq 'if (!autoDemoSessionRequested && !autoDemoSessionConsumed)' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt
          grep -Fq 'val real = labels.any' "$T"

      - name: Verify 420 OCR evidence is read-only, same-package, and two-frame verified
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          T=.github/native-overlay/TouchTestService.kt
          grep -Fq 'private fun selectedOpenTabVerifiedOnScreen(frame: Bitmap): Boolean' "$O"
          grep -Fq 'openFill - closedFill >= 16.0' "$O"
          grep -Fq 'recordExplicitEmptyOpenOcr(result, copy, observedAt)' "$O"
          grep -Fq 'emptyOpenOcrConsecutive >= 2' "$O"
          grep -Fq 'System.currentTimeMillis() - lastEmptyOpenOcrAt in 0L..4500L' "$O"
          grep -Fq 'lastEmptyOpenOcrPackage == reviewPackage' "$O"
          grep -Fq 'val verifiedDemoReview = demoVisibleNow || cachedDemoReview' "$O"
          grep -Fq 'ocrVerifiedEmptyOpenTab = ocrCurrent' "$O"
          grep -Fq 'confirmedByOcr = ocrVerifiedEmptyOpenTab && cachedDemoVerifiedOnChart' "$T"
          grep -Fq 'if (real || (!demo && !cachedDemoVerifiedOnChart)) {' "$T"
          grep -Fq 'demoEmptyReviewReads >= 2' "$O"
          grep -Fq 'tradePositionGate.brokerVerifiedEmptyDemoReview(true)' "$O"
          grep -Fq 'autoDemoSessionConsumed = true // only a persisted attempt consumes session' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Verify 420 empty-trade-list recognition does not allow blind unlock
        run: |
          set -e
          T=.github/native-overlay/TouchTestService.kt
          O=.github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'h * 0.88f' "$T"
          grep -Fq 'emptyPattern.matches(' "$T"
          grep -Fq 'demoEmptyReviewDiagnostic()' "$O"
          # 454: The G24 history has both tabs plus the bottom Transactions
          # navigation, sometimes without a page heading. Do not mistake
          # this page identity for proof of zero OPEN positions.
          grep -Fq 'val fullHistoryIdentity454 = pageTitle || (footer454 && openTab && closedTab454)' "$T"
          grep -Fq 'fullHistoryIdentity454 && openTab && explicitEmpty' "$T"
          grep -Fq 'if (real || (!demo && !cachedDemoVerifiedOnChart)) {' "$T" || grep -Fq 'if (real || (!demo && !cachedDemoVerifiedOnChart)) {' "$T"
          grep -Fq 'tradePositionGate.brokerVerifiedEmptyDemoReview(true)' "$O"
          grep -Fq 'demoEmptyReviewReads >= 2' "$O"
          grep -Fq 'autoDemoSessionConsumed = true // only a persisted attempt consumes session' "$O"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Verify 420 BIP strategy distinction and no duplicate DEMO order
        run: |
          set -e
          O=.github/native-overlay/ScalpOverlayService.kt
          T=.github/native-overlay/TouchTestService.kt
          grep -Fq 'SCALP M5 • FĂRĂ ORDIN: NU ESTE ȘOC' "$O"
          grep -Fq 'ȘOC VALID • ORDIN BLOCAT: ISTORIC' "$O"
          grep -Fq '0 POZIȚII 1/2 • AȘTEPT A DOUA CITIRE' "$O"
          grep -Fq 'activeStrategy == "SHOCK" &&' "$O"
          grep -Fq 'tradePositionGate.beginAttempt()' "$O"
          grep -Fq 'autoDemoSessionConsumed = true // only a persisted attempt consumes session' "$O"
          grep -Fq 'Nu există tranzacții deschise' "$T"
          grep -Fq 'No open positions' "$T"
          grep -Fq 'if (real || (!demo && !cachedDemoVerifiedOnChart)) {' "$T"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Verify 420 broker-window read-only fallback cannot authorize gestures
        run: |
          set -e
          T=.github/native-overlay/TouchTestService.kt
          S=.github/native-overlay/ScalpOverlayService.kt
          X=.github/native-overlay/touch_test_accessibility.xml
          grep -Fq 'private fun readOnlyBrokerRoot(svc: TouchTestService)' "$T"
          grep -Fq 'svc.windows.orEmpty().asSequence()' "$T"
          grep -Fq 'AccessibilityWindowInfo.TYPE_APPLICATION' "$T"
          grep -Fq 'flagRetrieveInteractiveWindows' "$X"
          grep -Fq 'val root = svc.rootInActiveWindow ?: return DemoOrderCheck' "$T"
          grep -Fq 'if (!BrokerAdapterRegistry.hasDemoExecutor(pkg))' "$T"
          grep -Fq 'lastConfirmedShockPercent > SHOCK_MIN_DEPTH' "$S"
          grep -Fq 'tradePositionGate.beginAttempt()' "$S"
          grep -Fq 'autoDemoSessionConsumed = true // only a persisted attempt consumes session' "$S"
          grep -Fq 'realOrderAdapterAvailable = false' .github/native-overlay/BrokerAdapterRegistry.kt

      - name: Guard overlay virtual tap against broker order execution
        run: |
          set -e
          grep -Fq 'tapVisibleOwnOverlayTarget' .github/native-overlay/TouchTestService.kt
          grep -Fq 'overlay.windowToken != target.windowToken' .github/native-overlay/TouchTestService.kt
          grep -Fq 'overlay.context.packageName != svc.packageName' .github/native-overlay/TouchTestService.kt
          grep -Fq 'SIM BUY' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'SIM SELL' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'targetBuy.setOnClickListener' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'targetSell.setOnClickListener' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'TouchTestService.tapVisibleOwnOverlayTarget' .github/native-overlay/ScalpOverlayService.kt
          ! grep -Eq 'AccessibilityService.*Pocket Option' .github/native-overlay/TouchTestService.kt

      - name: Verify permission-safe accessibility diagnostics
        run: |
          set -e
          grep -Fq 'ScalpOverlayService.setHiddenDuringAndroidSettings(true)' .github/native-overlay/TouchTestActivity.kt
          grep -Fq 'ScalpOverlayService.setHiddenDuringAndroidSettings(false)' .github/native-overlay/TouchTestActivity.kt
          ! grep -Fq 'stopService(Intent(this, ScalpOverlayService::class.java))' .github/native-overlay/TouchTestActivity.kt
          grep -Fq 'fun setHiddenDuringAndroidSettings(hidden: Boolean)' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'if (hidden) View.GONE else View.VISIBLE' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'compactStatusText?.text = "LIVE OPRIT"' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES' .github/native-overlay/TouchTestService.kt
          grep -Fq 'autoDemoArmed = false' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' .github/native-overlay/TouchTestActivity.kt
          grep -Fq 'Settings.ACTION_ACCESSIBILITY_SETTINGS' .github/native-overlay/TouchTestActivity.kt
          grep -Fq 'getTouchTestStatus' .github/native-overlay/ScalpOverlayModule.kt
          grep -Fq 'fun accessDiagnostic(context: Context)' .github/native-overlay/TouchTestService.kt
          grep -Fq 'Accesibilitatea se acordă O SINGURĂ DATĂ' .github/native-overlay/TouchTestActivity.kt
