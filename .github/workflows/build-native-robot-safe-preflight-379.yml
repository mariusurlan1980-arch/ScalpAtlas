            {x:.20,y:.596,txt:'EUR/USD OTC +92%'},
            {x:.20,y:.704,txt:'CHF/NOK OTC +92%'}
          ];
          const findExpanded=(records)=>{
            const ids=records.filter(r=>/\b[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}\b/i.test(r.txt));
            if(ids.length!==1) return null;
            const idY=ids[0].y;
            const pairs=records.filter(r=>r.y>=.21&&r.y<=idY-.02&&r.x>=.03&&r.x<=.74&&/\b[A-Z]{3}\/[A-Z]{3} OTC\b/i.test(r.txt));
            if(!pairs.length)return null;
            const maxY=Math.max(...pairs.map(p=>p.y));
            if(idY-maxY<.045||idY-maxY>.30)return null;
            const selected=pairs.filter(x=>Math.abs(x.y-maxY)<=.02);
            const names=[...new Set(selected.map(x=>x.txt.match(/\b[A-Z]{3}\/[A-Z]{3} OTC\b/i)[0]))];
            if(names.length!==1)return null;
            const rowText=records.filter(r=>Math.abs(r.y-maxY)<=.027).sort((a,b)=>a.x-b.x).map(x=>x.txt).join(' ');
            const pct=rowText.match(new RegExp(names[0].replace('/','\\/')+'\\s*\\+?(\\d{2,3})\\s*%','i'));
            return pct?{name:names[0],payout:Number(pct[1])}:null;
          };
          assert.deepEqual(findExpanded(rows),{name:'AUD/CHF OTC',payout:92});
          assert.equal(findExpanded(rows.concat({x:.3,y:.46,txt:'Ordin: '+uuid.replace(/^./,'8')})),null);
          assert.equal(findExpanded(rows.filter(r=>!r.txt.startsWith('Ordin:'))),null);
          assert.equal(findExpanded(rows.map(r=>r.y===.28?{...r,txt:'AUD/CHF OTC'}:r)),null);
          console.log('Expanded history detail isolated from unrelated old rows');
          NODE

