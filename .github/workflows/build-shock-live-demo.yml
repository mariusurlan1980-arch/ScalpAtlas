name: Build SHOCK LIVE Android main-package test APK

on:
  push:
    branches: [feature/shock-only-live]
    paths:
      - '.github/workflows/build-scalp-atlas-v100rc1.yml'
      - 'scalp-atlas-new/ShockLiveCandle.tsx'
      - 'scalp-atlas-new/ShockLiveRing.tsx'
      - 'scalp-atlas-new/ShockCompactOverlay.tsx'
      - '.github/native-overlay/**'
      - 'scalp-atlas-new/plugins/withShockScreenCapturePermissions.js'
      - '.github/templates/ScalpAtlasIntegratedAppV042.tsx'
      - '.github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx'
      - '.github/templates/ScalpAtlasAnalysisEngineV0416.ts'
      - '.github/templates/ScalpAtlasLocalizationV0418.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.native.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.web.ts'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.web.tsx'
      - '.github/workflows/build-shock-live-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply stable Scalp Atlas patches through v0.3.57
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            echo "Applying $f"
            python3 "$f"
          done

      - name: Integrate ANALIZĂ and LIVE with persistent VIDEO LIVE button
        run: |
          set -e
          cp .github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx scalp-atlas-new/LiveAnalysisApp.tsx
          cp .github/templates/ScalpAtlasAnalysisEngineV0416.ts scalp-atlas-new/analysisEngine.ts
          cp .github/templates/ScalpAtlasIntegratedAppV042.tsx scalp-atlas-new/App.tsx
          cp .github/templates/ScalpAtlasLocalizationV0418.ts scalp-atlas-new/localization.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.ts scalp-atlas-new/ocrAdapter.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.native.ts scalp-atlas-new/ocrAdapter.native.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.web.ts scalp-atlas-new/ocrAdapter.web.ts
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx scalp-atlas-new/AnalyzerBridge.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx scalp-atlas-new/AnalyzerBridge.native.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.web.tsx scalp-atlas-new/AnalyzerBridge.web.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json

          cfg_path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          expo = cfg['expo']
          expo['name'] = 'SCALP ATLAS'
          expo['slug'] = 'scalp-atlas'
          expo['version'] = '3.2.8'
          expo['android']['package'] = 'com.scalpatlas.app'
          expo['android']['versionCode'] = 328
          expo['ios']['bundleIdentifier'] = 'com.scalpatlas.app'
          expo['ios']['supportsTablet'] = True
          expo['orientation'] = 'default'
          expo.setdefault('web', {})['name'] = 'SCALP ATLAS'

          supported_locales = ['ro','en','de','es','fr','it','pt','nl','pl','uk','ru','tr','el','hu','cs','sk','bg','sr','hr','sl','ar','he','zh','ja','ko','hi']

          permissions = expo['android'].setdefault('permissions', [])
          if 'CAMERA' not in permissions:
              permissions.append('CAMERA')

          plugins = expo.setdefault('plugins', [])
          if './plugins/withShockScreenCapturePermissions' not in plugins:
              plugins.append('./plugins/withShockScreenCapturePermissions')
          has_camera = any(
              p == 'expo-camera' or (isinstance(p, list) and p and p[0] == 'expo-camera')
              for p in plugins
          )
          if not has_camera:
              plugins.append([
                  'expo-camera',
                  {
                      'cameraPermission': 'SCALP ATLAS folosește camera pentru analiza CAMERA LIVE a graficului de pe al doilea dispozitiv.'
                  }
              ])

          plugins[:] = [
              p for p in plugins
              if not (p == 'expo-localization' or (isinstance(p, list) and p and p[0] == 'expo-localization'))
          ]
          plugins.append([
              'expo-localization',
              {
                  'supportedLocales': {
                      'ios': supported_locales,
                      'android': supported_locales,
                  },
                  'supportsRTL': True,
                  'forcesRTL': False,
              }
          ])

          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify multilingual LIVE, cross-platform adapters and atlas
        run: |
          set -e
          grep -q "LiveAnalysisApp" scalp-atlas-new/App.tsx
          grep -q "t('cameraLive')" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "animateShutter={false}" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "recognizeText" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "detectChartEvidence" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "analysis.state === 'INVALID'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "trendLines.map(renderScalpLine)" scalp-atlas-new/LiveAnalysisApp.tsx
          # Legacy code is gated and cannot generate alerts.

          grep -q "playConfirmedAlert" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "directionRemainingSeconds" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scalpAtlas.live.guide.v0418.count" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "useAppLocalization" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "showLanguagePicker" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "LANGUAGE_NAMES" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "setLanguage('auto')" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "LANGUAGE_OVERRIDE_KEY" scalp-atlas-new/localization.ts
          grep -q "extraTranslations" scalp-atlas-new/localization.ts
          grep -q "statsDisclaimer" scalp-atlas-new/localization.ts
          grep -q "localizeReason" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "t('amountPlaceholder')" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "t('estimateHint')" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scalpAtlas.live.guide.v0418.count" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "languageCode.toUpperCase" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "SUPPORTED_LANGUAGES" scalp-atlas-new/localization.ts
          grep -q '"ro"' scalp-atlas-new/localization.ts
          grep -q '"ar"' scalp-atlas-new/localization.ts
          grep -q '"zh"' scalp-atlas-new/localization.ts
          grep -q '"hi"' scalp-atlas-new/localization.ts
          grep -q "AnalyzerBridge" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "createWorker" scalp-atlas-new/ocrAdapter.web.ts
          grep -q "expo-ocr-kit" scalp-atlas-new/ocrAdapter.ts
          grep -q "AnalyzerBridge.native" scalp-atlas-new/AnalyzerBridge.tsx
          grep -q '"total": "TOTAL"' scalp-atlas-new/localization.ts
          grep -q "expo-ocr-kit" scalp-atlas-new/ocrAdapter.native.ts
          grep -q "react-native-webview" scalp-atlas-new/AnalyzerBridge.native.tsx
          grep -q "iframe" scalp-atlas-new/AnalyzerBridge.web.tsx
          grep -q "parent.postMessage" scalp-atlas-new/analysisEngine.ts
          grep -q "directionDurationFor" scalp-atlas-new/analysisEngine.ts
          grep -q "SCALP_ATLAS_COUNT !== 70" scalp-atlas-new/atlas.ts
          grep -q "com.scalpatlas.app" scalp-atlas-new/app.json

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install base dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Install cross-platform LIVE dependencies
        working-directory: scalp-atlas-new
        run: |
          npx expo install expo-camera expo-audio expo-haptics expo-localization @react-native-async-storage/async-storage
          npm install tesseract.js

      - name: Generate selected Bip 1 alert for BUY and SELL
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import math, struct, wave

          assets = Path('scalp-atlas-new/assets')
          assets.mkdir(parents=True, exist_ok=True)

          RATE = 44100
          DURATION = 1.4
          FREQ = 880.0
          AMP = 0.28

          frames = bytearray()
          total = int(RATE * DURATION)
          for i in range(total):
              t = i / RATE
              fade = min(1.0, t / 0.01, (DURATION - t) / 0.03)
              sample = int(32767 * AMP * max(0.0, fade) * math.sin(2 * math.pi * FREQ * t))
              frames += struct.pack('<h', sample)

          def write(path):
              with wave.open(str(path), 'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(RATE)
                  w.writeframes(frames)

          # Același Bip 1 discret pentru orice semnal confirmat BUY sau SELL.
          write(assets/'buy-alert.wav')
          write(assets/'sell-alert.wav')
          PY

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Verify SHOCK safety boundary
        run: |
          grep -q 'SHOCK-only safety' scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q 'ShockCompactOverlay' scalp-atlas-new/LiveAnalysisApp.tsx

      - name: TypeScript check
        working-directory: scalp-atlas-new
        run: npx tsc --noEmit

      - name: Export Web app for PC and laptop
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo export --platform web --output-dir dist

      - name: Package Web build
        run: |
          cd scalp-atlas-new/dist
          zip -r ../../ScalpAtlas-v3.2.8-SHOCK-MAIN-PACKAGE-TEST-WEB.zip .
          cd ../..

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Install native SHOCK overlay and screen-capture service
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('scalp-atlas-new/android/app/src/main/java')
          apps=list(root.rglob('MainApplication.kt'))
          if len(apps)!=1: raise SystemExit('Expected one MainApplication.kt')
          app=apps[0]
          pkg=re.search(r'^package\s+([\w.]+)',app.read_text(),re.M)
          if not pkg: raise SystemExit('No Kotlin package')
          package=pkg.group(1)
          dst=root.joinpath(*package.split('.'))
          dst.mkdir(parents=True,exist_ok=True)
          for name in ('ScalpOverlayService.kt','ScalpOverlayModule.kt','ScalpOverlayPackage.kt'):
              source=Path('.github/native-overlay')/name
              code=source.read_text(encoding='utf-8')
              code=re.sub(r'^package\s+[\w.]+', 'package '+package,code,count=1,flags=re.M)
              (dst/name).write_text(code,encoding='utf-8')
          code=app.read_text(encoding='utf-8')
          needle='PackageList(this).packages.apply {'
          if needle not in code: raise SystemExit('Cannot register native package')
          code=code.replace(needle,needle+'\n        add(ScalpOverlayPackage())',1)
          app.write_text(code,encoding='utf-8')
          manifest=Path('scalp-atlas-new/android/app/src/main/AndroidManifest.xml')
          xml=manifest.read_text(encoding='utf-8')
          for perm in ('SYSTEM_ALERT_WINDOW','FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PROJECTION'):
              entry='<uses-permission android:name="android.permission.'+perm+'" />'
              if entry not in xml: xml=xml.replace('<application',entry+'\n  <application',1)
          service='<service android:name=".ScalpOverlayService" android:exported="false" android:foregroundServiceType="mediaProjection" />'
          if service not in xml: xml=xml.replace('</application>',service+'\n  </application>',1)
          manifest.write_text(xml,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scalp-atlas-new/android/app/build.gradle')
          s=p.read_text()
          if 'com.google.mlkit:text-recognition:' not in s:
              s=s.replace('dependencies {',"dependencies {\n    implementation 'com.google.mlkit:text-recognition:16.0.1'",1)
          p.write_text(s)
          PY
          mkdir -p scalp-atlas-new/android/app/src/main/res/raw
          cp scalp-atlas-new/assets/buy-alert.wav scalp-atlas-new/android/app/src/main/res/raw/scalp_bip.wav
          mkdir -p /tmp/scalp-engine scalp-atlas-new/android/app/src/main/assets
          (cd scalp-atlas-new && npx tsc analysisEngine.ts atlas.ts --ignoreConfig --target ES2020 --module commonjs --skipLibCheck --esModuleInterop --outDir /tmp/scalp-engine --noEmitOnError false) || true
          node - <<'NODE'
          const fs=require('fs');
          const engine=require('/tmp/scalp-engine/analysisEngine.js');
          if (!engine.ANALYSIS_ENGINE_HTML) throw Error('Missing analyzer HTML');
          fs.writeFileSync('scalp-atlas-new/android/app/src/main/assets/analysis_engine.html',engine.ANALYSIS_ENGINE_HTML);
          NODE

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v3.2.8-SHOCK-MAIN-PACKAGE-TEST.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v3.2.8-SHOCK-MAIN-PACKAGE-TEST
          path: |
            ScalpAtlas-v3.2.8-SHOCK-MAIN-PACKAGE-TEST.apk
            ScalpAtlas-v3.2.8-SHOCK-MAIN-PACKAGE-TEST-WEB.zip
          if-no-files-found: error

      - name: Confirm isolated DEMO artifact
        run: echo 'DEMO artifact uploaded; existing public release remains unchanged.'
