name: Build Flory Flowers APK

on:
  push:
    branches: [ main ]
    paths:
      - "flory-live/**"
      - ".github/workflows/build-flory-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: gradle -p flory-live :app:assembleDebug
      - name: Rename APK
        run: cp flory-live/app/build/outputs/apk/debug/app-debug.apk FloryFlowers.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloryFlowers-Android
          path: FloryFlowers.apk
          if-no-files-found: error
