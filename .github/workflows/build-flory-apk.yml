name: Build Flory Flowers APK

on:
  push:
    branches: [ main ]
    paths:
      - "flory-live/**"
      - ".github/workflows/build-flory-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug APK
        run: |
          cd flory-live
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FloryFlowers.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FloryFlowers-Android
          path: FloryFlowers.apk
