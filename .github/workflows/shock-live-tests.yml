name: SHOCK LIVE detector tests
on:
  push:
    branches: [feature/shock-live-candle]
    paths:
      - 'prototype/**'
      - '.github/workflows/shock-live-tests.yml'
  workflow_dispatch:
jobs:
  synthetic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic intrabar replay
        run: |
          node prototype/shock-live-detector.test.mjs
          node prototype/shock-live-pipeline.test.mjs
