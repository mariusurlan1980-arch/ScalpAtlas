name: SCALP ATLAS v1.0.48 CANDIDATE DIAGNOSTIC

on:
  push:
    branches: ['feature/scalp-atlas-v1.0.48-diagnostic-candidates']
    paths:
      - '.github/workflows/build-overlay-companion-v200.yml'
      - '.github/overlay-companion-v200.patch'
      - '.github/scripts/genericize_overlay_v1027.py'
      - '.github/scripts/harden_timeframe_v1028.py'
      - '.github/scripts/timeframe_roi_v1029.py'
      - '.github/scripts/monitoring_labels_v1030.py'
      - '.github/scripts/safe_signal_ui_v1031.py'
      - '.github/scripts/strict_timeframe_roi_v1032.py'
      - '.github/scripts/signal_hold_v1035.py'
      - '.github/scripts/responsive_confirm_v1036.py'
      - '.github/scripts/ro_signal_labels_v1037.py'
      - '.github/scripts/timeframe_ocr_fix_v1038.py'
      - '.github/scripts/timeframe_parser_fix_v1039.py'
      - '.github/scripts/m10_entry_guard_v1044.py'
      - '.github/scripts/one_alert_per_bar_v1045.py'
      - '.github/scripts/chart_timeframe_roi_v1046.py'
      - '.github/scripts/m5_early_signal_guard_v1047.py'
      - '.github/scripts/preview_candidates_v1048.py'
      - '.github/templates/ScalpAtlasIntegratedAppV042.tsx'
      - '.github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx'
      - '.github/templates/ScalpAtlasAnalysisEngineV0416.ts'
      - '.github/templates/ScalpAtlasLocalizationV0418.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.native.ts'
      - '.github/templates/ScalpAtlasOcrAdapterV0416.web.ts'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx'
      - '.github/templates/ScalpAtlasAnalyzerBridgeV0416.web.tsx'
      - '.github/native-overlay/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-atlas-overlay-companion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply isolated overlay companion patch
        run: git apply .github/overlay-companion-v200.patch

      - name: Make overlay generic and true AUTO
        run: |
          set -e
          python3 .github/scripts/genericize_overlay_v1027.py
          python3 .github/scripts/harden_timeframe_v1028.py
          python3 .github/scripts/timeframe_roi_v1029.py
          python3 .github/scripts/monitoring_labels_v1030.py
          python3 .github/scripts/safe_signal_ui_v1031.py
          python3 .github/scripts/strict_timeframe_roi_v1032.py
          python3 .github/scripts/signal_hold_v1035.py
          python3 .github/scripts/responsive_confirm_v1036.py
          python3 .github/scripts/ro_signal_labels_v1037.py
          python3 .github/scripts/timeframe_ocr_fix_v1038.py
          python3 .github/scripts/timeframe_parser_fix_v1039.py
          python3 .github/scripts/m10_entry_guard_v1044.py
          python3 .github/scripts/one_alert_per_bar_v1045.py
          python3 .github/scripts/chart_timeframe_roi_v1046.py
          python3 .github/scripts/m5_early_signal_guard_v1047.py
          python3 .github/scripts/preview_candidates_v1048.py
          ! grep -R -q "Pocket Option" .github/native-overlay/ScalpOverlayService.kt .github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx
          ! grep -R -q "POCKET OPTION" .github/native-overlay/ScalpOverlayService.kt .github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx
          grep -q 'currentTimeframe = "AUTO"' .github/native-overlay/ScalpOverlayService.kt
          grep -q "GENERIC CHART GATE v1.0.27" .github/native-overlay/ScalpOverlayService.kt
          grep -q "timeframeCandidateCount" .github/native-overlay/ScalpOverlayService.kt
          grep -q "v1.0.29 targeted timeframe OCR applied" .github/scripts/timeframe_roi_v1029.py
          grep -q "rightMidScaled" .github/native-overlay/ScalpOverlayService.kt
          grep -q "Confirmare timeframe 1/2" .github/native-overlay/ScalpOverlayService.kt
          ! grep -q '"MONITORIZARE"' .github/native-overlay/ScalpOverlayService.kt
          grep -q '"PAUZĂ SEMNAL"' .github/native-overlay/ScalpOverlayService.kt
          grep -q "NU INTRA" .github/native-overlay/ScalpOverlayService.kt
          grep -q '"CONFIRMAT " + REQUIRED_CONFIRMATIONS' .github/native-overlay/ScalpOverlayService.kt
          grep -q "STRICT TIMEFRAME ROI" .github/native-overlay/ScalpOverlayService.kt
          grep -q "normalizeTimeframe(cleanRightText)" .github/native-overlay/ScalpOverlayService.kt
          grep -q "normalizePair(leftText)" .github/native-overlay/ScalpOverlayService.kt
          grep -q "SIGNAL_HOLD_MS = 10_000L" .github/native-overlay/ScalpOverlayService.kt
          grep -q "signalVisibleUntil" .github/native-overlay/ScalpOverlayService.kt
          grep -q "SEMNAL FIX • rămâne afișat 10 secunde" .github/native-overlay/ScalpOverlayService.kt
          grep -q "REQUIRED_CONFIRMATIONS = 2" .github/native-overlay/ScalpOverlayService.kt
          grep -q "CONFIRMATION_SPACING_MS = 8000L" .github/native-overlay/ScalpOverlayService.kt
          grep -q "val reason = result.optString" .github/native-overlay/ScalpOverlayService.kt
          grep -q '"BUY" -> "CUMPĂRARE"' .github/native-overlay/ScalpOverlayService.kt
          grep -q '"SELL" -> "VÂNZARE"' .github/native-overlay/ScalpOverlayService.kt
          grep -q "signalLabel(rawSignal)" .github/native-overlay/ScalpOverlayService.kt
          grep -q "timeframeMissCount" .github/native-overlay/ScalpOverlayService.kt
          grep -q "rightFocusScaled" .github/native-overlay/ScalpOverlayService.kt
          grep -q "crop.width \* 4" .github/native-overlay/ScalpOverlayService.kt
          grep -q "v1.0.39" .github/native-overlay/ScalpOverlayService.kt
          grep -q "M10 5-MINUTE ENTRY GUARD v1.0.44" .github/native-overlay/ScalpOverlayService.kt
          grep -q "m10EntryTimingRejection" .github/native-overlay/ScalpOverlayService.kt
          grep -q "chartCountdownEvidenceCount" .github/native-overlay/ScalpOverlayService.kt
          grep -q "noteChartCountdownFromChart" .github/native-overlay/ScalpOverlayService.kt
          grep -q 'ONE-ALERT-PER-M10-BAR v1.0.45' .github/native-overlay/ScalpOverlayService.kt
          grep -q 'STABLE-CANDIDATE FIX v1.0.45' .github/native-overlay/ScalpOverlayService.kt
          grep -q 'candidateBarKey != currentChartBarKey' .github/native-overlay/ScalpOverlayService.kt
          grep -q 'getStringSet("barKeys"' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'SCALP ATLAS • AUTO' .github/native-overlay/ScalpOverlayService.kt
          ! grep -Fq 'SCALP ATLAS • M10' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'timeframeTitleText?.text = "SCALP ATLAS • " + currentTimeframe' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'val focusTf = normalizeTimeframe(focusText)' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'currentTimeframe = "AUTO"' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'cropAndScale(0.69f, 0.28f, 0.89f, 0.46f)' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq "EARLY M5 BIP GUARD v1.0.47" .github/native-overlay/ScalpOverlayService.kt
          grep -Fq "val timingRejection = m10EntryTimingRejection(now) ?: m5EntryTimingRejection(now)" .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'chartCountdownTf != "M5"' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'currentTimeframe == "M5" || currentTimeframe == "M10"' .github/native-overlay/ScalpOverlayService.kt
          grep -Fq 'val barMillis = if (currentTimeframe == "M5") 300_000L else 600_000L' .github/native-overlay/ScalpOverlayService.kt
          ! grep -Fq 'currentM10BarKey' .github/native-overlay/ScalpOverlayService.kt
          grep -q '"REQUIRES_PRICE_VERIFICATION"' .github/native-overlay/ScalpOverlayService.kt
          grep -q "val normalized = text" .github/native-overlay/ScalpOverlayService.kt
          grep -Fq '"M5"  to Regex' .github/native-overlay/ScalpOverlayService.kt
          ! grep -Fq 'val compact = text.uppercase().replace(" ", "")' .github/native-overlay/ScalpOverlayService.kt

      - name: Apply stable Scalp Atlas patches
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            python3 "$f"
          done

      - name: Restore exact Clean View UI and motor
        run: |
          set -e
          cp .github/templates/ScalpAtlasIntegratedLiveV100RC1.tsx scalp-atlas-new/LiveAnalysisApp.tsx
          cp .github/templates/ScalpAtlasAnalysisEngineV0416.ts scalp-atlas-new/analysisEngine.ts
          cp .github/templates/ScalpAtlasIntegratedAppV042.tsx scalp-atlas-new/App.tsx
          cp .github/templates/ScalpAtlasLocalizationV0418.ts scalp-atlas-new/localization.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.ts scalp-atlas-new/ocrAdapter.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.native.ts scalp-atlas-new/ocrAdapter.native.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.web.ts scalp-atlas-new/ocrAdapter.web.ts
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx scalp-atlas-new/AnalyzerBridge.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx scalp-atlas-new/AnalyzerBridge.native.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.web.tsx scalp-atlas-new/AnalyzerBridge.web.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('scalp-atlas-new/app.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          expo=cfg['expo']
          expo['name']='SCALP ATLAS'
          expo['slug']='scalp-atlas'
          expo['version']='1.0.48'
          expo['orientation']='default'
          expo['android']['package']='com.scalpatlas.app'
          expo['android']['versionCode']=148
          expo['ios']['bundleIdentifier']='com.scalpatlas.app'
          permissions=expo['android'].setdefault('permissions',[])
          if 'CAMERA' not in permissions:
              permissions.append('CAMERA')
          supported=['ro','en','de','es','fr','it','pt','nl','pl','uk','ru','tr','el','hu','cs','sk','bg','sr','hr','sl','ar','he','zh','ja','ko','hi']
          plugins=expo.setdefault('plugins',[])
          if not any(p=='expo-camera' or (isinstance(p,list) and p and p[0]=='expo-camera') for p in plugins):
              plugins.append(['expo-camera',{'cameraPermission':'SCALP ATLAS folosește camera pentru analiza CAMERA LIVE a graficului de pe al doilea dispozitiv.'}])
          plugins[:]=[p for p in plugins if not (p=='expo-localization' or (isinstance(p,list) and p and p[0]=='expo-localization'))]
          plugins.append(['expo-localization',{'supportedLocales':{'ios':supported,'android':supported},'supportsRTL':True,'forcesRTL':False}])
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Verify exact old interface plus signal-only change
        run: |
          set -e
          grep -q "v1.0.2 CLEAN VIEW" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "t('cameraLive')" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scalpAtlas.live.guide.v0418.count" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "signalLockRef" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "requiredConfirmations = currentTf === 'M1' || currentTf === 'M10' || !currentTf ? 3 : 2" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "signalLockSecondsFor" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "const lockActive = !!activeLock.dir" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "O singură citire OCR slabă nu trebuie să anuleze" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "downloadFirst: true" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "AUDIO GATE v1.0.8" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "if (!player.isLoaded) return false" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "v1.0.2 CLEAN VIEW" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "AUDIO GATE v1.0.8" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "minSpacingMs = currentTf === 'M10' || !currentTf" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "currentTf === 'M1'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "nowMs - lastAt >= minSpacingMs" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "QUALITY GATE v0.2.6" scalp-atlas-new/analysisEngine.ts
          grep -q "REVERSAL / EXHAUSTION GUARD v0.2.7" scalp-atlas-new/analysisEngine.ts
          grep -q "buyRecovery<.45" scalp-atlas-new/analysisEngine.ts
          grep -q "sellRetrace<.45" scalp-atlas-new/analysisEngine.ts
          grep -q "Păstrăm fereastra estimată de direcție din motor chiar în etapa AȘTEAPTĂ" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "FRESH BREAKOUT GUARD v0.2.8" scalp-atlas-new/analysisEngine.ts
          grep -q "staleBuyBreakout" scalp-atlas-new/analysisEngine.ts
          grep -q "staleSellBreakout" scalp-atlas-new/analysisEngine.ts
          grep -q "activePullback" scalp-atlas-new/analysisEngine.ts
          grep -q "FIXED_ANALYSIS_TIMEFRAME = 'M10'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "timeframeRef = useRef<string | null>(FIXED_ANALYSIS_TIMEFRAME)" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "const engineTf = FIXED_ANALYSIS_TIMEFRAME" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "if(score>=.84)return 5" scalp-atlas-new/analysisEngine.ts
          grep -q "if(score>=.78)return 6" scalp-atlas-new/analysisEngine.ts
          grep -q "return 7" scalp-atlas-new/analysisEngine.ts
          grep -q "0.3.3-reversal-safety" scalp-atlas-new/analysisEngine.ts
          grep -Fq 'if(bodies.length<3)return null;' scalp-atlas-new/analysisEngine.ts
          grep -Fq 'closedColors:[trio[0].tone,trio[1].tone]' scalp-atlas-new/analysisEngine.ts
          grep -Fq 'y1=Math.floor(h*.97)' scalp-atlas-new/analysisEngine.ts
          ! grep -Fq 'y1=Math.floor(h*.73)' scalp-atlas-new/analysisEngine.ts
          grep -q "CLOSED CANDLE GUARD v0.3.2" scalp-atlas-new/analysisEngine.ts
          grep -Fq 'REVERSAL SAFETY v0.3.3' scalp-atlas-new/analysisEngine.ts
          grep -Fq "candleEvidence.activeColor!==expectedLiveColor" scalp-atlas-new/analysisEngine.ts
          grep -Fq "ATENȚIE REVERSARE: ultima lumânare activă contrazice" scalp-atlas-new/analysisEngine.ts
          grep -Fq "lastPixels/refPixels>2.6" scalp-atlas-new/analysisEngine.ts
          grep -q "Ultimele două lumânări au culori diferite" scalp-atlas-new/analysisEngine.ts
          grep -q "CUMPĂRARE blocată" scalp-atlas-new/analysisEngine.ts
          grep -q "VÂNZARE blocată" scalp-atlas-new/analysisEngine.ts
          grep -q "currentTf === 'M1' || currentTf === 'M10'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "currentTf === 'M1'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "{analysis.directionMin && analysis.directionMax" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "consensus>=.40" scalp-atlas-new/analysisEngine.ts
          grep -q "alignmentCount>=3" scalp-atlas-new/analysisEngine.ts
          grep -q "score=Math.min(score,.88)" scalp-atlas-new/analysisEngine.ts
          grep -q "SUPRAPUNERE LIVE · ORICE BROKER" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "SCALP ATLAS OVERLAY" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "UN SINGUR TELEFON • ORICE GRAFIC" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "NativeModules.ScalpOverlay.startOverlayMode" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "window.AndroidBridge&&window.AndroidBridge.postMessage" scalp-atlas-new/analysisEngine.ts
          grep -q "GENERIC CHART CROP v1.0.27" .github/native-overlay/ScalpOverlayService.kt
          grep -q "STREAM FIX v1.0.17" .github/native-overlay/ScalpOverlayService.kt
          grep -q "window.ScalpAtlasAnalyze" .github/templates/ScalpAtlasAnalysisEngineV0416.ts
          grep -q "Cadre " .github/native-overlay/ScalpOverlayService.kt
          grep -q "Android WebView executes canvas/image work reliably" .github/native-overlay/ScalpOverlayService.kt
          grep -q "Erori " .github/native-overlay/ScalpOverlayService.kt
          grep -q "TextRecognition.getClient" .github/native-overlay/ScalpOverlayService.kt
          grep -q "normalizePair" .github/native-overlay/ScalpOverlayService.kt
          grep -q "startFramePolling" .github/native-overlay/ScalpOverlayService.kt
          grep -q "ScalpAtlasPing" .github/templates/ScalpAtlasAnalysisEngineV0416.ts
          grep -q "Do not overwrite it" .github/native-overlay/ScalpOverlayService.kt
          grep -q "GENERIC CHART GATE v1.0.27" .github/native-overlay/ScalpOverlayService.kt
          grep -q "GRAFIC NEDETECTAT" .github/native-overlay/ScalpOverlayService.kt
          ! grep -q "candidateStillFresh" .github/native-overlay/ScalpOverlayService.kt
          grep -q "SIGNAL LOCK v1.0.23" .github/native-overlay/ScalpOverlayService.kt
          grep -q "expiry.coerceIn(1, 60)" .github/native-overlay/ScalpOverlayService.kt
          ! grep -q "ANALIZEZ..." .github/native-overlay/ScalpOverlayService.kt
          grep -q "FLUX ÎNGHEȚAT" .github/native-overlay/ScalpOverlayService.kt
          ! grep -q "<\\/script></body></html>" .github/templates/ScalpAtlasAnalysisEngineV0416.ts
          grep -q "</script></body></html>" .github/templates/ScalpAtlasAnalysisEngineV0416.ts
          ! grep -q "FLAG_SECURE" .github/native-overlay/ScalpOverlayService.kt
          grep -q "gravity = Gravity.TOP or Gravity.END" .github/native-overlay/ScalpOverlayService.kt
          ! grep -q "liveCandleMarkerStyle" scalp-atlas-new/LiveAnalysisApp.tsx
          ! grep -q "trendLines.map(renderScalpLine)" <(grep -v "Compatibilitate verificare build" scalp-atlas-new/LiveAnalysisApp.tsx)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: |
          npm install
          npx expo install expo-camera expo-audio expo-haptics expo-localization @react-native-async-storage/async-storage expo-ocr-kit react-native-webview
          npm install tesseract.js

      - name: Generate Bip 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math,struct,wave
          assets=Path('scalp-atlas-new/assets'); assets.mkdir(parents=True,exist_ok=True)
          rate=44100; duration=1.4; freq=880.0; amp=.28
          frames=bytearray()
          for i in range(int(rate*duration)):
              t=i/rate
              fade=min(1.0,t/.01,(duration-t)/.03)
              sample=int(32767*amp*max(0.0,fade)*math.sin(2*math.pi*freq*t))
              frames+=struct.pack('<h',sample)
          for name in ['buy-alert.wav','sell-alert.wav']:
              with wave.open(str(assets/name),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(frames)
          PY

      - name: Generate launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: TypeScript check
        working-directory: scalp-atlas-new
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean


      - name: Reduce APK size for 64-bit Android phones
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          props=Path('scalp-atlas-new/android/gradle.properties')
          s=props.read_text(encoding='utf-8')
          if re.search(r'^reactNativeArchitectures=',s,flags=re.M):
              s=re.sub(r'^reactNativeArchitectures=.*$', 'reactNativeArchitectures=arm64-v8a', s, flags=re.M)
          else:
              s+='\nreactNativeArchitectures=arm64-v8a\n'
          props.write_text(s,encoding='utf-8')
          app=Path('scalp-atlas-new/android/app/build.gradle')
          body=app.read_text(encoding='utf-8')
          if 'defaultConfig {' not in body:
              raise SystemExit('defaultConfig missing: cannot safely limit ABIs')
          body=body.replace('defaultConfig {','defaultConfig {\n        ndk { abiFilters "arm64-v8a" }',1)
          app.write_text(body,encoding='utf-8')
          PY
          grep -Fxq 'reactNativeArchitectures=arm64-v8a' scalp-atlas-new/android/gradle.properties
          grep -Fq 'ndk { abiFilters "arm64-v8a" }' scalp-atlas-new/android/app/build.gradle

      - name: Add ML Kit OCR Android dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scalp-atlas-new/android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          dependency="    implementation 'com.google.mlkit:text-recognition:16.0.1'\n"
          if 'com.google.mlkit:text-recognition:' not in s:
              marker='dependencies {'
              if marker not in s:
                  raise SystemExit('dependencies block not found in app/build.gradle')
              s=s.replace(marker, marker+'\n'+dependency, 1)
              p.write_text(s,encoding='utf-8')
          PY
          grep -q "com.google.mlkit:text-recognition:16.0.1" scalp-atlas-new/android/app/build.gradle

      - name: Inject Android live overlay and screen stream
        run: |
          set -e
          JAVA_DIR="scalp-atlas-new/android/app/src/main/java/com/scalpatlas/app"
          mkdir -p "$JAVA_DIR"
          cp .github/native-overlay/ScalpOverlayPackage.kt "$JAVA_DIR/ScalpOverlayPackage.kt"
          cp .github/native-overlay/ScalpOverlayModule.kt "$JAVA_DIR/ScalpOverlayModule.kt"
          cp .github/native-overlay/ScalpOverlayService.kt "$JAVA_DIR/ScalpOverlayService.kt"

          python3 - <<'PY'
          from pathlib import Path

          roots=list(Path('scalp-atlas-new/android/app/src/main/java').rglob('MainApplication.kt'))
          if not roots:
              raise SystemExit('MainApplication.kt not found')
          p=roots[0]
          s=p.read_text(encoding='utf-8')
          if 'ScalpOverlayPackage()' not in s:
              needle='PackageList(this).packages.apply {'
              if needle not in s:
                  raise SystemExit('PackageList apply block not found')
              s=s.replace(needle, needle+'\n        add(ScalpOverlayPackage())', 1)
          p.write_text(s,encoding='utf-8')

          m=Path('scalp-atlas-new/android/app/src/main/AndroidManifest.xml')
          s=m.read_text(encoding='utf-8')
          perms=[
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
          ]
          marker='<application'
          for perm in perms:
              if perm not in s:
                  s=s.replace(marker, perm+'\n  '+marker, 1)
          service='<service android:name=".ScalpOverlayService" android:exported="false" android:foregroundServiceType="mediaProjection" />'
          if service not in s:
              s=s.replace('</application>', '    '+service+'\n  </application>', 1)
          m.write_text(s,encoding='utf-8')
          PY

          mkdir -p scalp-atlas-new/android/app/src/main/res/raw
          cp scalp-atlas-new/assets/buy-alert.wav scalp-atlas-new/android/app/src/main/res/raw/scalp_bip.wav

          rm -rf /tmp/scalp-engine
          mkdir -p /tmp/scalp-engine
          (
            cd scalp-atlas-new
            npx tsc analysisEngine.ts atlas.ts --ignoreConfig --target ES2020 --module commonjs --skipLibCheck --esModuleInterop --outDir /tmp/scalp-engine --noEmitOnError false || true
          )
          test -s /tmp/scalp-engine/analysisEngine.js
          mkdir -p scalp-atlas-new/android/app/src/main/assets
          node - <<'NODE'
          const fs=require('fs');
          const engine=require('/tmp/scalp-engine/analysisEngine.js');
          if(!engine.ANALYSIS_ENGINE_HTML) throw new Error('ANALYSIS_ENGINE_HTML missing');
          fs.writeFileSync('scalp-atlas-new/android/app/src/main/assets/analysis_engine.html',engine.ANALYSIS_ENGINE_HTML);
          NODE

          grep -q "ScalpOverlayPackage()" "$(find scalp-atlas-new/android/app/src/main/java -name MainApplication.kt | head -1)"
          grep -q "SYSTEM_ALERT_WINDOW" scalp-atlas-new/android/app/src/main/AndroidManifest.xml
          grep -q "FOREGROUND_SERVICE_MEDIA_PROJECTION" scalp-atlas-new/android/app/src/main/AndroidManifest.xml
          grep -q "ScalpOverlayService" scalp-atlas-new/android/app/src/main/AndroidManifest.xml
          test -s scalp-atlas-new/android/app/src/main/assets/analysis_engine.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scalp-atlas-new/android/app/src/main/assets/analysis_engine.html')
          s=p.read_text(encoding='utf-8')
          if '<\\/script>' in s:
              raise SystemExit('escaped closing script still present')
          if '</script></body></html>' not in s:
              raise SystemExit('valid closing script missing')
          PY
          test -s scalp-atlas-new/android/app/src/main/res/raw/scalp_bip.wav

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify package, embedded bundle, UI and signature
        run: |
          set -e
          APK="scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          # ARM64 only, never silently publish a large universal package.
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK still contains other ABIs - refusing to publish"
            exit 1
          fi
          du -h "$APK"
          unzip -l "$APK" | grep -E "assets/(index\.android\.bundle|.*\.bundle)"
          unzip -l "$APK" | grep -F "assets/analysis_engine.html"
          unzip -p "$APK" assets/index.android.bundle > /tmp/index.android.bundle
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/index.android.bundle').read_bytes()
          required=[
              'CAMERA LIVE',
              'SCALP ATLAS OVERLAY',
              'SUPRAPUNERE LIVE · ORICE BROKER',
              'UN SINGUR TELEFON • ORICE GRAFIC',
              'Ține apăsat pe fereastra Scalp Atlas și trage pentru poziționare.',
          ]
          missing=[]
          for text in required:
              p8=data.find(text.encode('utf-8'))
              p16=data.find(text.encode('utf-16le'))
              print(text, 'utf8=', p8, 'utf16le=', p16)
              if p8 < 0 and p16 < 0:
                  missing.append(text)
          if missing:
              raise SystemExit('Missing overlay UI in final bundle: ' + ' | '.join(missing))
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing.txt
          cp "$APK" ScalpAtlas-v1.0.48-CANDIDATE-DIAGNOSTIC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v1.0.48-CANDIDATE-DIAGNOSTIC
          path: ScalpAtlas-v1.0.48-CANDIDATE-DIAGNOSTIC.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publish v1.0.48 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-v1.0.48-candidate-diagnostic --cleanup-tag --yes || true
          gh release create scalp-atlas-v1.0.48-candidate-diagnostic \
            ScalpAtlas-v1.0.48-CANDIDATE-DIAGNOSTIC.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS v1.0.48 CANDIDATE DIAGNOSTIC" \
            --notes "SCALP ATLAS v1.0.48 TEST DEMO: arată candidatul BUY sau SELL numai ca NECONFIRMAT și fără BIP, împreună cu motivul filtrului care îl blochează. BIP-ul rămâne permis exclusiv pe BUY/SELL confirmat de motor, fără praguri slăbite și fără ordine automate. Interfață existentă, corecții M5/M10 și protecțiile anterioare păstrate. Semnalele nu sunt validate ca profitabile; observă fără a tranzacționa."
