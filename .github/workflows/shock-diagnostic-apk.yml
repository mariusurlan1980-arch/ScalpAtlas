name: SHOCK diagnostic APK
on:
  push:
    branches: [feature/scalpatlas-shock-v022]
    paths:
      - 'shock-android/**'
      - '.github/workflows/shock-diagnostic-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: shock-android
      - uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-SHOCK-diagnostic-debug-apk
          path: shock-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
