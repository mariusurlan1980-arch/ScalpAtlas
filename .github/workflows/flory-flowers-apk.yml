name: Build Flory Flowers APK

on:
  push:
    branches:
      - flory-flowers-apk
    paths:
      - 'FloryFlowers/**'
      - '.github/workflows/flory-flowers-apk.yml'
  workflow_dispatch:

jobs:
  build-flory-flowers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p build/FloryFlowers
          unzip -q FloryFlowers/Flory-Flowers-Android-ready.zip -d build/FloryFlowers

      - name: Build debug APK
        run: gradle -p build/FloryFlowers :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flory-Flowers-APK
          path: build/FloryFlowers/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
