name: Build Scalp Atlas v1.0.5 Old UI Signal Fix

on:
  push:
    branches:
      - scalp-old-ui-signal-fix-v105
    paths:
      - 'scalp-atlas-old-ui-v105/**'
      - '.github/workflows/build-scalp-atlas-v105-old-ui-signal-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Reassemble exact old UI
        working-directory: scalp-atlas-old-ui-v105
        run: |
          cat App.part1.txt App.part2.txt App.part3.txt App.part4.txt > App.js
          test -s App.js
          grep -F "SCALP ATLAS" App.js
          grep -F "createSignalStabilizer({ confirmations: 3, minimumConfirmationMs: 20000 })" App.js

      - name: Install dependencies
        working-directory: scalp-atlas-old-ui-v105
        run: npm install

      - name: Align Expo dependencies
        working-directory: scalp-atlas-old-ui-v105
        run: CI=1 npx expo install --fix

      - name: Run signal engine tests
        working-directory: scalp-atlas-old-ui-v105
        run: npm test

      - name: Generate Android project
        working-directory: scalp-atlas-old-ui-v105
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Restore original Scalp Atlas launcher icon
        working-directory: scalp-atlas-old-ui-v105
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          SRC="../scalp-atlas-new/assets/app-icon.svg"
          RES="android/app/src/main/res"
          test -s "$SRC"
          for spec in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $spec
            d=$1
            s=$2
            f=$3
            mkdir -p "$RES/mipmap-$d"
            rm -f "$RES/mipmap-$d/ic_launcher."* "$RES/mipmap-$d/ic_launcher_round."* "$RES/mipmap-$d/ic_launcher_foreground."*
            rsvg-convert -w "$s" -h "$s" "$SRC" -o "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
            rsvg-convert -w "$f" -h "$f" "$SRC" -o "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          if [ -f "$RES/values/colors.xml" ]; then
            sed -i 's#<color name="iconBackground">[^<]*</color>#<color name="iconBackground">#07111f</color>#' "$RES/values/colors.xml" || true
          fi

      - name: Force release to use the matching debug signing key
        working-directory: scalp-atlas-old-ui-v105/android
        run: |
          grep -n "signingConfig signingConfigs.debug" app/build.gradle
          echo "Release will use the same certificate as the installed Scalp Atlas."

      - name: Build standalone release APK with embedded JS bundle
        working-directory: scalp-atlas-old-ui-v105/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify standalone bundle package and matching certificate
        run: |
          APK="scalp-atlas-old-ui-v105/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | tee apk-files.txt
          grep -E "assets/(index\.android\.bundle|.*\.bundle)" apk-files.txt
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -F "com.scalpatlas.app"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing.txt
          grep -Fi "5e8f16062ea3cd2c4a0d547876baa6f38cabf625" signing.txt
          cp "$APK" ScalpAtlas-v1.0.5-UPDATE-OLD-APP-SIGNAL-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v1.0.5-UPDATE-OLD-APP-SIGNAL-FIX
          path: ScalpAtlas-v1.0.5-UPDATE-OLD-APP-SIGNAL-FIX.apk
          if-no-files-found: error
          retention-days: 30
