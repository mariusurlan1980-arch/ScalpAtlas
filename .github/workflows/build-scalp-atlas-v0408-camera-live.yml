name: Build SCALP ATLAS v0.4.8 CAMERA LIVE APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scalp-atlas-v0408-camera-live.yml'
      - '.github/templates/ScalpAtlasIntegratedAppV042.tsx'
      - '.github/templates/ScalpAtlasIntegratedLiveV048.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply stable Scalp Atlas patches through v0.3.57
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            echo "Applying $f"
            python3 "$f"
          done

      - name: Integrate ANALIZĂ and LIVE with persistent VIDEO LIVE button
        run: |
          set -e
          cp .github/templates/ScalpAtlasIntegratedLiveV048.tsx scalp-atlas-new/LiveAnalysisApp.tsx
          cp .github/templates/ScalpAtlasIntegratedAppV042.tsx scalp-atlas-new/App.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json

          cfg_path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          expo = cfg['expo']
          expo['name'] = 'SCALP ATLAS'
          expo['slug'] = 'scalp-atlas'
          expo['version'] = '0.4.7'
          expo['android']['package'] = 'com.scalpatlas.app'
          expo['android']['versionCode'] = 76
          expo['ios']['bundleIdentifier'] = 'com.scalpatlas.app'

          permissions = expo['android'].setdefault('permissions', [])
          if 'CAMERA' not in permissions:
              permissions.append('CAMERA')

          plugins = expo.setdefault('plugins', [])
          has_camera = any(
              p == 'expo-camera' or (isinstance(p, list) and p and p[0] == 'expo-camera')
              for p in plugins
          )
          if not has_camera:
              plugins.append([
                  'expo-camera',
                  {
                      'cameraPermission': 'SCALP ATLAS folosește camera pentru analiza CAMERA LIVE a graficului de pe al doilea dispozitiv.'
                  }
              ])

          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify VIDEO LIVE and atlas
        run: |
          set -e
          grep -q "LiveAnalysisApp" scalp-atlas-new/App.tsx
          grep -q "CAMERA LIVE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "animateShutter={false}" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "TIMEFRAME AUTO" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "recognizeText" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "trendLines.map(renderScalpLine)" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "CONFIRMARE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "const engineTf = activeTf || 'M15'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "Confirmare LIVE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "nextCount < 3" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "titleCyan" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scoreTrack" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scoreFill" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "playConfirmedAlert" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "translateY: 18" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "nextCount === 3" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "Alarmă: ON" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "SCALP_ATLAS_COUNT !== 70" scalp-atlas-new/atlas.ts
          grep -q "com.scalpatlas.app" scalp-atlas-new/app.json

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install base dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Install LIVE dependencies compatible with Expo
        working-directory: scalp-atlas-new
        run: npx expo install expo-camera expo-audio expo-haptics @react-native-async-storage/async-storage

      - name: Generate BUY SELL alert tones
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import math, struct, wave

          assets = Path('scalp-atlas-new/assets')
          assets.mkdir(parents=True, exist_ok=True)

          RATE = 44100
          AMP = 0.34

          def write_tone(path, segments):
              frames = bytearray()
              for freq, duration in segments:
                  total = int(RATE * duration)
                  for i in range(total):
                      if freq <= 0:
                          sample = 0
                      else:
                          # small fade in/out to avoid clicks
                          fade = min(1.0, i / max(1, int(RATE*0.012)), (total-i-1) / max(1, int(RATE*0.012)))
                          sample = int(32767 * AMP * fade * math.sin(2*math.pi*freq*i/RATE))
                      frames += struct.pack('<h', sample)
              with wave.open(str(path), 'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(RATE)
                  w.writeframes(frames)

          # BUY: două beep-uri scurte, mai înalte.
          write_tone(assets/'buy-alert.wav', [
              (920, 0.12), (0, 0.08), (1080, 0.12)
          ])

          # SELL: un beep mai lung, mai jos.
          write_tone(assets/'sell-alert.wav', [
              (520, 0.38)
          ])
          PY

      - name: TypeScript check
        working-directory: scalp-atlas-new
        run: npx tsc --noEmit

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v0.4.8-CAMERA-LIVE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.4.8-CAMERA-LIVE
          path: ScalpAtlas-v0.4.8-CAMERA-LIVE.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-v0.4.8-camera-live --cleanup-tag --yes || true
          gh release create scalp-atlas-v0.4.8-camera-live \
            ScalpAtlas-v0.4.8-CAMERA-LIVE.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS v0.4.8 CAMERA LIVE" \
            --notes "CAMERA LIVE v0.4.8: mută indicatorul mic ● LIVE din dreapta sus cu 18 px mai jos, astfel încât să fie complet vizibil sub bara Android cu semnal și baterie. Restul interfeței și funcțiilor din v0.4.7 rămân neschimbate: camera continuă, timeframe AUTO, liniile Scalp, confirmarea 3/3, alertele BUY/SELL cu sunet și vibrație, bara de scor, 70 modele, istoric, statistici și jurnal."
