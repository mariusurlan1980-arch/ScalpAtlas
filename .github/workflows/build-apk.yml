name: Build Scalp Atlas APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ScalpAtlas_Android_FIXED_70.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack project
        run: unzip -q ScalpAtlas_Android_FIXED_70.zip -d buildsrc
      - name: Build APK
        run: |
          DIR=$(find buildsrc -name settings.gradle -printf '%h\n' | head -n 1)
          cd "$DIR"
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ScalpAtlas-v1.1.5-OWNER-VIDEO.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v1.1.5-OWNER-VIDEO
          path: ScalpAtlas-v1.1.5-OWNER-VIDEO.apk
