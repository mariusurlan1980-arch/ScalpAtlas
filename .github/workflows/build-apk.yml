name: Build Scalp Atlas APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ["ScalpAtlas_Android_FIXED_70.zip", ".github/workflows/build-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: unzip -q ScalpAtlas_Android_FIXED_70.zip -d buildsrc
      - name: Build APK
        run: |
          DIR=$(find buildsrc -name settings.gradle -printf '%h\n' | head -n 1)
          cd "$DIR"
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ScalpAtlas-v1.1.6-OWNER-VIDEO-SEPARAT.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v1.1.6-OWNER-VIDEO-SEPARAT
          path: ScalpAtlas-v1.1.6-OWNER-VIDEO-SEPARAT.apk
