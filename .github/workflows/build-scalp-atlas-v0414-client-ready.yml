name: Build SCALP ATLAS v0.4.14 CLIENT READY APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scalp-atlas-v0414-client-ready.yml'
      - '.github/templates/ScalpAtlasIntegratedAppV042.tsx'
      - '.github/templates/ScalpAtlasIntegratedLiveV0414.tsx'
      - '.github/templates/ScalpAtlasAnalysisEngineV0410.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply stable Scalp Atlas patches through v0.3.57
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            echo "Applying $f"
            python3 "$f"
          done

      - name: Integrate ANALIZĂ and LIVE with persistent VIDEO LIVE button
        run: |
          set -e
          cp .github/templates/ScalpAtlasIntegratedLiveV0414.tsx scalp-atlas-new/LiveAnalysisApp.tsx
          cp .github/templates/ScalpAtlasAnalysisEngineV0410.ts scalp-atlas-new/analysisEngine.ts
          cp .github/templates/ScalpAtlasIntegratedAppV042.tsx scalp-atlas-new/App.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json

          cfg_path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          expo = cfg['expo']
          expo['name'] = 'SCALP ATLAS'
          expo['slug'] = 'scalp-atlas'
          expo['version'] = '0.4.14'
          expo['android']['package'] = 'com.scalpatlas.app'
          expo['android']['versionCode'] = 82
          expo['ios']['bundleIdentifier'] = 'com.scalpatlas.app'

          permissions = expo['android'].setdefault('permissions', [])
          if 'CAMERA' not in permissions:
              permissions.append('CAMERA')

          plugins = expo.setdefault('plugins', [])
          has_camera = any(
              p == 'expo-camera' or (isinstance(p, list) and p and p[0] == 'expo-camera')
              for p in plugins
          )
          if not has_camera:
              plugins.append([
                  'expo-camera',
                  {
                      'cameraPermission': 'SCALP ATLAS folosește camera pentru analiza CAMERA LIVE a graficului de pe al doilea dispozitiv.'
                  }
              ])

          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify VIDEO LIVE and atlas
        run: |
          set -e
          grep -q "LiveAnalysisApp" scalp-atlas-new/App.tsx
          grep -q "CAMERA LIVE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "animateShutter={false}" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "TIMEFRAME AUTO" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "recognizeText" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "detectChartEvidence" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "GRAFIC NEDETECTAT" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "PORNIRE RAPIDĂ" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "ULTIMELE SEMNALE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "GRAFIC DETECTAT • ANALIZĂ ACTIVĂ" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scalpAtlas.live.guide.v0414" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "analysis.state === 'INVALID'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "trendLines.map(renderScalpLine)" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "CONFIRMARE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "const engineTf = activeTf || 'M15'" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "Confirmare LIVE" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "nextCount < 2" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "titleCyan" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scoreTrack" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "scoreFill" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "playConfirmedAlert" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "translateY: 18" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "nextCount === 2" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "Alarmă: ON" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "CADRU FIXAT" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "Confirmare: 2 cadre" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "Durată estimată direcție" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "directionRemainingSeconds" scalp-atlas-new/LiveAnalysisApp.tsx
          grep -q "directionDurationFor" scalp-atlas-new/analysisEngine.ts
          grep -q "volatility" scalp-atlas-new/analysisEngine.ts
          grep -q "SCALP_ATLAS_COUNT !== 70" scalp-atlas-new/atlas.ts
          grep -q "com.scalpatlas.app" scalp-atlas-new/app.json

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install base dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Install LIVE dependencies compatible with Expo
        working-directory: scalp-atlas-new
        run: npx expo install expo-camera expo-audio expo-haptics @react-native-async-storage/async-storage

      - name: Generate selected Bip 1 alert for BUY and SELL
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import math, struct, wave

          assets = Path('scalp-atlas-new/assets')
          assets.mkdir(parents=True, exist_ok=True)

          RATE = 44100
          DURATION = 1.4
          FREQ = 880.0
          AMP = 0.28

          frames = bytearray()
          total = int(RATE * DURATION)
          for i in range(total):
              t = i / RATE
              fade = min(1.0, t / 0.01, (DURATION - t) / 0.03)
              sample = int(32767 * AMP * max(0.0, fade) * math.sin(2 * math.pi * FREQ * t))
              frames += struct.pack('<h', sample)

          def write(path):
              with wave.open(str(path), 'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(RATE)
                  w.writeframes(frames)

          # Același Bip 1 discret pentru orice semnal confirmat BUY sau SELL.
          write(assets/'buy-alert.wav')
          write(assets/'sell-alert.wav')
          PY

      - name: TypeScript check
        working-directory: scalp-atlas-new
        run: npx tsc --noEmit

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v0.4.14-CLIENT-READY.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.4.14-CLIENT-READY
          path: ScalpAtlas-v0.4.14-CLIENT-READY.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-v0.4.14-client-ready --cleanup-tag --yes || true
          gh release create scalp-atlas-v0.4.14-client-ready \
            ScalpAtlas-v0.4.14-CLIENT-READY.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS v0.4.14 CLIENT READY" \
            --notes "v0.4.14 păstrează motorul stabil v0.4.12 și adaugă finisaje pentru clienți: ghid de pornire în 3 pași, indicator clar GRAFIC DETECTAT / GRAFIC NEDETECTAT, ultimele 3 semnale direct pe ecranul LIVE, identificare de versiune și mesaj explicit că semnalele sunt estimări. Se păstrează cele 70 de modele, Chart Guard, confirmarea în 2 cadre, Bip 1, timeframe AUTO și durata estimată a direcției."
