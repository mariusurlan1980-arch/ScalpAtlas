name: Live OTC research unit tests
on:
  push:
    branches: ['research/live-otc-feed-20261012']
    paths:
      - 'scalp-atlas-new/liveDataEngine.js'
      - 'scalp-atlas-new/liveDataEngine.test.js'
      - 'scalp-atlas-new/otchartsReadOnlyAdapter.js'
      - 'scalp-atlas-new/otchartsReadOnlyAdapter.test.js'
      - 'scalp-atlas-new/freeLiveProbe.js'
      - 'scalp-atlas-new/freeLiveProbe.test.js'
      - 'scalp-atlas-new/freeM5Backtest.js'
      - 'scalp-atlas-new/freeM5Backtest.test.js'
      - 'scalp-atlas-new/quoteMatchAuditor.js'
      - 'scalp-atlas-new/quoteMatchAuditor.test.js'
      - 'scalp-atlas-new/ownLiveResearchEngine.js'
      - 'scalp-atlas-new/ownLiveResearchEngine.test.js'
      - 'scalp-atlas-new/LIVE_OTC_README.md'
      - '.github/workflows/verify-live-otc-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no fake signals and read-only ticker safety
        run: node --test scalp-atlas-new/liveDataEngine.test.js scalp-atlas-new/otchartsReadOnlyAdapter.test.js scalp-atlas-new/freeLiveProbe.test.js scalp-atlas-new/freeM5Backtest.test.js scalp-atlas-new/quoteMatchAuditor.test.js scalp-atlas-new/ownLiveResearchEngine.test.js
