name: DEMO stake editor 626 offline balance replay
on:
  push:
    branches: [test/626-demo-stake-preparation]
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual stake editor balance parser
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/DemoStakeEditor.kt').read_text()
          f=s.split('  internal fun parseDemoBalance626(',1)[1].split('  private data class Chart(',1)[0]
          Path('/tmp/Balance626.kt').write_text('fun parseDemoBalance626('+f)
          PY
          cat >> /tmp/Balance626.kt <<'KOTLIN'
          fun main() {
            check(parseDemoBalance626("1,571.32")==157132L)
            check(parseDemoBalance626("1,572.41 USD")==157241L)
            check(parseDemoBalance626("1.571,32")==157132L)
            check(parseDemoBalance626("1571.32")==157132L)
            check(parseDemoBalance626("1571,32")==157132L)
            check(parseDemoBalance626("0.00")==0L)
            check(parseDemoBalance626("QT Demo 1,571.32")==null)
            check(parseDemoBalance626("1,57.32")==null)
            check(parseDemoBalance626("1,571.32 1.09")==null)
            check(parseDemoBalance626("-1.09")==null)
            println("PASS 10 offline grouped-balance cases")
          }
          KOTLIN
          kotlinc /tmp/Balance626.kt -include-runtime -d /tmp/balance626.jar
          java -jar /tmp/balance626.jar

      - name: Check verified settlement to editor integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('.github/native-overlay')
          p=(d/'DemoAutoStakePlan565.kt').read_text()
          e=(d/'DemoStakeEditor.kt').read_text()
          t=(d/'TouchTestService.kt').read_text()
          s=(d/'ScalpOverlayService.kt').read_text()
          h=s.split('private fun prepareVerifiedMartingaleAmount626(',1)[1].split('private fun maybeRearmConfirmedDemoBase618(',1)[0]
          for guard in ('autoDemoSessionConsumed','TradePositionGate.State.READY','realFxAccountVisible()','pendingVerifiedSettlement626(key,pair)','verifiedOpenPositionId429() == null','getBoolean("attempted",false)','readBrokerDemoOrder476(pair) != (stake to 92)'):
              assert guard in h, guard
          assert h.index('prepareVerifiedMartingaleStake626(') < h.index('confirmEdited(key,pair,stake,true)')
          for forbidden in ('pressVerifiedDemoStakeOnce429(', 'dispatchGesture(', 'beginAttempt(', 'autoDemoSessionConsumed = false'):
              assert forbidden not in h
          assert '.putString("lastVerifiedSettlement626",positionId)' in p
          assert 'id !in prefs.getStringSet("seenClosedIds",emptySet()).orEmpty()' in p
          assert '3964L)' in e and 'DemoAutoStakePlan565.EDITOR_MAX_STAKE_CENTS' in e
          assert 'after.balanceCents < stakeCents' in e
          assert 'plan.pendingVerifiedSettlement626(accountKey,pair).stakeCents == stakeCents' in t
          assert 'CHART_ONLY_DEMO_462 && stake429 != 109L' in s
          print('PASS source integration checks; no new order path enabled')
          PY
