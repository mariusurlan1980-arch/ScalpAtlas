name: Scalp Atlas 559 Android optical preview checks
on:
  push:
    branches: [feature/scalpatlas-559-native-demo-signal-preview]
    paths:
      - 'scalp-atlas-new/shockNativeEngine.ts'
      - '.github/native-overlay/ScalpOverlayService.kt'
      - '.github/scripts/test_559_optical_preview.mjs'
      - '.github/workflows/scalp-atlas-559-native-preview-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test 559 preview and no-trade guard
        run: node --test .github/scripts/test_559_optical_preview.mjs
