name: SHOCK core tests
on:
  push:
    branches: [feature/scalpatlas-shock-v022]
    paths:
      - 'shock-core/**'
      - '.github/workflows/shock-core-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test shock-core/*.test.mjs
