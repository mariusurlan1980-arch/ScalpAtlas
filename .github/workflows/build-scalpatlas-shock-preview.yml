name: Build ScalpAtlas 3.2.7 SHOCK preview APK

on:
  push:
    branches:
      - feature/scalpatlas-v0327-shock-overlay
    paths:
      - 'scalp-atlas-new/**'
      - '.github/workflows/build-scalpatlas-shock-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Mark preview version without changing installed release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          cfg['expo']['version'] = '0.3.27'
          cfg['expo']['name'] = 'SCALP ATLAS SHOCK PREVIEW'
          cfg['expo']['android']['versionCode'] = 38
          cfg['expo']['android']['package'] = 'com.scalpatlas.shockpreview'
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install packages
        working-directory: scalp-atlas-new
        run: npm install
      - name: Generate icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png
      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Build APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-3.2.7-SHOCK-PREVIEW-NOT-LIVE
          path: scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
