name: Chart result OCR retention regression
on:
  push:
    branches: [test/chart-result-transient-ocr]
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay actual Kotlin parser and capture cadence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          a=s.split('  private fun parseChartResult620(',1)[1].split('  private fun observeChartResult619(',1)[0]
          b=s.split('  private fun chartResultCaptureInterval627(',1)[1].split('  private fun chartResultAttemptKey627(',1)[0]
          Path('/tmp/Chart627.kt').write_text('private const val OCR_INTERVAL_MS=3000L\nprivate fun parseChartResult620('+a+'\nprivate fun chartResultCaptureInterval627('+b)
          h=s.split('private fun observeChartResult619(',1)[1].split('private fun chartResultDiagnostic619(',1)[0]
          for guard in ('capturedAt - wall !in 300_000L..345_000L','observedAt - capturedAt !in 0L..2_500L','TouchTestService.realFxAccountVisible()','TouchTestService.readVisibleDemoPair() != pair','capturedAt - chartResultLastAt619 >= 1_000L','chartResultConflict627'):
              assert guard in h,guard
          for forbidden in ('onVerifiedClosed(', 'confirmEdited(', 'putBoolean("attempted",false)', 'dispatchGesture(', 'autoDemoSessionConsumed = false'):
              assert forbidden not in h,forbidden
          PY
          cat >> /tmp/Chart627.kt <<'KOTLIN'
          fun main() {
            val p="AED/CNY OTC"
            check(parseChartResult620(listOf("AED/CNY OTC WIN P/L: +1.00 USD"),p,109)=="WIN")
            check(parseChartResult620(listOf("AED/CNY OTC LOSS P/L: -1.09 USD"),p,109)=="LOSS")
            check(parseChartResult620(listOf("AED/CNY OTC WIN P/L: +2.09 USD"),p,109)==null)
            check(parseChartResult620(listOf("AED/CNY OTC LOSS P/L: -2.28 USD"),p,109)==null)
            check(parseChartResult620(listOf("AED/CNY WIN P/L: +1.00 USD"),p,109)==null)
            check(parseChartResult620(listOf("AED/CNY OTC WIN LOSS P/L: +1.00 USD"),p,109)==null)
            check(parseChartResult620(listOf("AED/CNY OTC WIN"),p,109)==null)
            check(parseChartResult620(listOf("AED/CNY OTC WIN P/L: +1.00 USD","AED/CNY OTC LOSS P/L: -1.09 USD"),p,109)==null)
            val t=1000000L
            check(chartResultCaptureInterval627(t+284999,t)==3000L)
            check(chartResultCaptureInterval627(t+285000,t)==900L)
            check(chartResultCaptureInterval627(t+300000,t)==900L)
            check(chartResultCaptureInterval627(t+345000,t)==900L)
            check(chartResultCaptureInterval627(t+345001,t)==3000L)
            check(chartResultCaptureInterval627(t,-1)==3000L)
            println("PASS 14 offline chart-result and sampling cases")
          }
          KOTLIN
          kotlinc /tmp/Chart627.kt -include-runtime -d /tmp/chart627.jar
          java -jar /tmp/chart627.jar

      - name: Verify persistent evidence is tied to attempt and cannot settle it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          h=s.split('private fun observeChartResult619(',1)[1].split('private fun startBrokerAccountMonitor()',1)[0]
          assert 'prefs.getString("chartEvidenceAttempt628",null) == attemptKey627' in h
          assert 'prefs.getString("chartEvidenceAttempt628",null) == currentKey' in h
          assert 'savedAt - wall in 300_000L..345_000L' in h
          assert 'chartResultReads619 >= 2 && !chartResultConflict627' in h
          assert '.putBoolean("chartEvidenceConflict628",true).commit()' in h
          assert 'REZULTAT RATAT ' in h
          for forbidden in ('onVerifiedClosed(', 'confirmEdited(', 'putBoolean("attempted",false)', 'autoDemoSessionConsumed = false', 'dispatchGesture('):
              assert forbidden not in h,forbidden
          print('PASS persistent observation source guards; no settlement or rearm authorization')
          PY

      - name: Replay auxiliary balance comparison only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          h=s.split('  private fun compareChartBalance628(',1)[1].split('  private fun chartResultCaptureInterval627(',1)[0]
          Path('/tmp/BalanceEvidence628.kt').write_text('private fun compareChartBalance628('+h)
          assert 'prefs.getLong("chartBalanceWall628",-1L) != wall' in s
          assert 'prefs.getString("chartEvidenceAttempt628",null) != attemptKey' in s
          assert 'if (comparison == outcome) "CONCORDANT" else "NECONFIRMAT"' in s
          PY
          cat >> /tmp/BalanceEvidence628.kt <<'KOTLIN'
          fun main() {
            check(compareChartBalance628(157241,157341,109)=="WIN")
            check(compareChartBalance628(157241,157132,109)=="LOSS")
            check(compareChartBalance628(157241,157241,109)=="DRAW")
            check(compareChartBalance628(157241,157450,109)==null)
            check(compareChartBalance628(-1,157341,109)==null)
            check(compareChartBalance628(100,0,109)==null)
            check(compareChartBalance628(157241,157451,228)=="WIN")
            println("PASS 7 auxiliary balance cases; no settlement authorization")
          }
          KOTLIN
          kotlinc /tmp/BalanceEvidence628.kt -include-runtime -d /tmp/balance-evidence628.jar
          java -jar /tmp/balance-evidence628.jar

      - name: Replay red zero badge against synthetic image and rejection cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          a=s.split('  private fun parseRealLossBadge629(',1)[1].split('  // Pure parser:',1)[0]
          a=a.replace('com.google.mlkit.vision.text.Text','FakeText')
          stub='''
          class Rect(val left:Int,val top:Int,val right:Int,val bottom:Int) {
            fun centerX()=(left+right)/2
            fun centerY()=(top+bottom)/2
            fun width()=right-left
            fun height()=bottom-top
          }
          class Line(val text:String,val boundingBox:Rect?)
          class Block(val lines:List<Line>)
          class FakeText(val textBlocks:List<Block>)
          class Bitmap(val width:Int=720,val height:Int=1600) {
            private val pixels=IntArray(width*height){0x101010}
            fun getPixel(x:Int,y:Int)=pixels[y*width+x]
            fun fill(x1:Int,y1:Int,x2:Int,y2:Int,color:Int){
              for(y in y1 until y2) for(x in x1 until x2) pixels[y*width+x]=color
            }
          }
          '''
          Path('/tmp/Badge629.kt').write_text(stub+'\nprivate fun parseRealLossBadge629('+a)
          h=s.split('private fun observeChartResult619(',1)[1].split('private fun startBrokerAccountMonitor()',1)[0]
          assert 'prefs.getString("chartConflictAttempt630",null) == attemptKey627' in h
          assert 'prefs.getString("chartConflictAttempt630",null) == attemptKey' in h
          assert 'prefs.getString("chartConflictAttempt630",null) == currentKey' in h
          assert 'chartResultCandidate619 != key' in h
          assert 'retryChartBalance629(prefs,pkg,pair,wall,stake,saved)' in h
          for forbidden in ('onVerifiedClosed(', 'confirmEdited(', 'putBoolean("attempted",false)', 'dispatchGesture(', 'autoDemoSessionConsumed = false'):
              assert forbidden not in h,forbidden
          PY
          cat >> /tmp/Badge629.kt <<'KOTLIN'
          fun main() {
            val box=Rect(300,700,326,722)
            val line=Line("\$0",box)
            fun t(vararg lines:Line)=FakeText(listOf(Block(lines.toList())))
            val loss=Bitmap().apply{
              fill(334,698,368,724,0xE63038)
              fill(347,706,356,715,0xFFFFFF)
            }
            check(parseRealLossBadge629(t(line),loss)=="LOSS")
            check(parseRealLossBadge629(t(line),Bitmap())==null)
            check(parseRealLossBadge629(t(Line("\$1",box)),loss)==null)
            check(parseRealLossBadge629(t(line,line),loss)==null)
            check(parseRealLossBadge629(t(Line("\$0",Rect(300,120,326,142))),loss)==null)
            val green=Bitmap().apply{fill(334,698,368,724,0x30CC60)}
            check(parseRealLossBadge629(t(line),green)==null)
            val red=Bitmap().apply{fill(334,698,368,724,0xE63038)}
            check(parseRealLossBadge629(t(line),red)==null)
            println("PASS seven synthetic visual badge cases; read-only evidence")
          }
          KOTLIN
          kotlinc /tmp/Badge629.kt -include-runtime -d /tmp/badge629.jar
          java -jar /tmp/badge629.jar

      - name: Replay exact Kotlin sample retention predicate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          p=s.split('  private fun retainChartSample631(',1)[1].split('  private fun resetChartResult619(',1)[0]
          Path('/tmp/Retention631.kt').write_text('private fun retainChartSample631('+p)
          h=s.split('private fun observeChartResult619(',1)[1].split('private fun retryChartBalance629(',1)[0]
          assert 'retainChartSample631(chartResultCandidate619,attemptKey627,' in h
          assert 'capturedAt - chartResultLastAt619 > 4_000L' in h
          assert h.index('if (outcome == null)') < h.index('val key = attemptKey627 + outcome')
          assert 'chartResultReads619 = 2' in h
          PY
          cat >> /tmp/Retention631.kt <<'KOTLIN'
          fun main() {
            val key = "demo|AED/CNY OTC|"
            val sample = key + "LOSS"
            check(retainChartSample631(sample,key,1000,1900))
            check(retainChartSample631(sample,key,1000,5000))
            check(!retainChartSample631(sample,key,1000,5001))
            check(!retainChartSample631(sample,key,1000,999))
            check(!retainChartSample631("",key,1000,1900))
            check(!retainChartSample631(sample,"demo|EUR/USD OTC|",1000,1900))
            check(!retainChartSample631(sample,"",1000,1900))
            check(!retainChartSample631(sample,key,0,1900))
            println("PASS 8 actual Kotlin OCR retention boundary cases")
          }
          KOTLIN
          kotlinc /tmp/Retention631.kt -include-runtime -d /tmp/retention631.jar
          java -jar /tmp/retention631.jar

      - name: Replay exact stake debit evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          p=s.split('  private fun exactChartDebit632(',1)[1].split('  private fun observeChartDebit632(',1)[0]
          Path('/tmp/Debit632.kt').write_text('private fun exactChartDebit632('+p)
          h=s.split('  private fun observeChartDebit632(',1)[1].split('  private fun chartResultDiagnostic619(',1)[0]
          for guard in ('now - wall !in 1_000L..30_000L','chartBalanceWall628','readVisibleDemoPair() != pair','realFxAccountVisible()','now - chartDebitFirstAt632 < 1_000L','chartDebitAttempt632'):
              assert guard in h, guard
          for forbidden in ('onVerifiedClosed(', 'confirmEdited(', 'dispatchGesture(', 'putBoolean("attempted",false)'):
              assert forbidden not in h, forbidden
          PY
          cat >> /tmp/Debit632.kt <<'KOTLIN'
          fun main() {
            check(exactChartDebit632(157241,157132,109))
            check(exactChartDebit632(157241,157013,228))
            check(!exactChartDebit632(157241,157241,109))
            check(!exactChartDebit632(157241,157131,109))
            check(!exactChartDebit632(157241,157242,109))
            check(!exactChartDebit632(-1,0,109))
            check(!exactChartDebit632(100,0,109))
            check(!exactChartDebit632(157241,157240,1))
            println("PASS 8 exact stake debit cases; observation only")
          }
          KOTLIN
          kotlinc /tmp/Debit632.kt -include-runtime -d /tmp/debit632.jar
          java -jar /tmp/debit632.jar

      - name: Replay explicit chart zero-open recovery guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/native-overlay/TouchTestService.kt').read_text()
          s=Path('.github/native-overlay/ScalpOverlayService.kt').read_text()
          p=t.split('    internal fun parseExplicitOpenCount634(',1)[1].split('    fun inspectExplicitZeroOpenOnDemoChart634(',1)[0]
          Path('/tmp/OpenCount634.kt').write_text('internal fun parseExplicitOpenCount634('+p)
          h=t.split('    fun inspectExplicitZeroOpenOnDemoChart634(',1)[1].split('    fun inspectVisibleDemoOpenBadgeReadOnly(',1)[0]
          for guard in ('parseExplicitOpenCount634(labels) != 0','realFxAccountVisible()','readFxChartPayout(expectedPair,false) != 92','queue.isNotEmpty()','inspectVisibleDemoOpenBadgeReadOnly()'):
              assert guard in h, guard
          a=s.split('  private fun recoverOldUnknownOnChart634(',1)[1].split('  private fun startBrokerAccountMonitor(',1)[0]
          for guard in ('freshSessionWall624 - wall < 345_000L','verifiedOpenPositionId429() != null','freshSessionRecovery624Used','stake != 109L','chartEvidenceAttempt628','chartConflictAttempt630','inspectExplicitZeroOpenOnDemoChart634(pkg,pair)','nowElapsed - chartEmptyFirstAt634 < 2_000L','archiveOldDemoAttempt624(prefs,pkg,oldPair,stake,payout,"CHART_EXPLICIT_ZERO")'):
              assert guard in a, guard
          for forbidden in ('dispatchGesture(', 'onVerifiedClosed(', 'confirmEdited(', 'putBoolean("attempted",false)'):
              assert forbidden not in a, forbidden
          PY
          cat >> /tmp/OpenCount634.kt <<'KOTLIN'
          fun main() {
            check(parseExplicitOpenCount634(listOf("Open positions: 0"))==0)
            check(parseExplicitOpenCount634(listOf("0 open trades"))==0)
            check(parseExplicitOpenCount634(listOf("Poziții deschise: 0"))==0)
            check(parseExplicitOpenCount634(listOf("0 tranzacții deschise"))==0)
            check(parseExplicitOpenCount634(listOf("Open positions: 1"))==1)
            check(parseExplicitOpenCount634(listOf("Open positions: 0","Open positions: 1"))==null)
            check(parseExplicitOpenCount634(listOf("Tranzacții","0","$"+"0"))==null)
            check(parseExplicitOpenCount634(listOf("Closed trades: 0"))==null)
            check(parseExplicitOpenCount634(emptyList())==null)
            check(parseExplicitOpenCount634(listOf("Open positions: 0","0 open trades"))==0)
            println("PASS 10 explicit open count parser cases")
          }
          KOTLIN
          kotlinc /tmp/OpenCount634.kt -include-runtime -d /tmp/open-count634.jar
          java -jar /tmp/open-count634.jar
