name: Build SCALP ATLAS Standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'scalp-atlas-new/**'
      - '.github/scripts/patch_scalp_atlas_v032.py'
      - '.github/scripts/patch_scalp_atlas_v033.py'
      - '.github/scripts/patch_scalp_atlas_v034.py'
      - '.github/scripts/patch_scalp_atlas_v035.py'
      - '.github/scripts/patch_scalp_atlas_v036.py'
      - '.github/scripts/patch_scalp_atlas_v037.py'
      - '.github/scripts/patch_scalp_atlas_v038.py'
      - '.github/scripts/patch_scalp_atlas_v039.py'
      - '.github/scripts/patch_scalp_atlas_v0310.py'
      - '.github/scripts/patch_scalp_atlas_v0311.py'
      - '.github/scripts/patch_scalp_atlas_v0312.py'
      - '.github/scripts/patch_scalp_atlas_v0313.py'
      - '.github/scripts/patch_scalp_atlas_v0314.py'
      - '.github/scripts/patch_scalp_atlas_v0315.py'
      - '.github/workflows/build-scalp-atlas-new.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.2 Trend Scalp confirmation fix
        run: python3 .github/scripts/patch_scalp_atlas_v032.py

      - name: Apply v0.3.3 breakout level and Android spacing fix
        run: python3 .github/scripts/patch_scalp_atlas_v033.py

      - name: Apply v0.3.4 verified breakout level and result visibility fix
        run: python3 .github/scripts/patch_scalp_atlas_v034.py

      - name: Apply v0.3.5 deterministic expiry and timeframe warning fix
        run: python3 .github/scripts/patch_scalp_atlas_v035.py

      - name: Apply v0.3.6 expanding triangle geometry validation
        run: python3 .github/scripts/patch_scalp_atlas_v036.py

      - name: Apply v0.3.7 breakout body-close confirmation
        run: python3 .github/scripts/patch_scalp_atlas_v037.py

      - name: Apply v0.3.8 recent-extreme confirmation
        run: python3 .github/scripts/patch_scalp_atlas_v038.py

      - name: Apply v0.3.9 slim signal arrow variant 3
        run: python3 .github/scripts/patch_scalp_atlas_v039.py

      - name: Apply v0.3.10 smart free-space arrow
        run: python3 .github/scripts/patch_scalp_atlas_v0310.py

      - name: Apply v0.3.11 anti-chasing exhaustion guard
        run: python3 .github/scripts/patch_scalp_atlas_v0311.py

      - name: Apply v0.3.12 signal freshness countdown
        run: python3 .github/scripts/patch_scalp_atlas_v0312.py

      - name: Apply v0.3.13 forward arrow placement
        run: python3 .github/scripts/patch_scalp_atlas_v0313.py

      - name: Apply v0.3.14 confirmation filter
        run: python3 .github/scripts/patch_scalp_atlas_v0314.py

      - name: Apply v0.3.15 last-candle momentum guard
        run: python3 .github/scripts/patch_scalp_atlas_v0315.py

      - name: Apply v0.3.15 visual title and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('scalp-atlas-new/App.tsx')
          text = app.read_text(encoding='utf-8')

          old_title = '<Text style={styles.logo}>SCALP ATLAS</Text>'
          new_title = "<Text style={styles.logo}><Text style={{ color: '#20E0FF' }}>SC</Text><Text style={{ color: '#28BFFF' }}>AL</Text><Text style={{ color: '#557FFF' }}>P </Text><Text style={{ color: '#8758FF' }}>AT</Text><Text style={{ color: '#C43AF2' }}>LA</Text><Text style={{ color: '#FF2DB8' }}>S</Text></Text>"
          if old_title not in text:
              raise SystemExit('Titlul SCALP ATLAS nu a fost găsit; build oprit pentru siguranță.')
          text = text.replace(old_title, new_title, 1)

          old_style = "logo: { color: '#f7fafc', fontSize: 25, fontWeight: '900', letterSpacing: 1.4 },"
          new_style = "logo: { color: '#f7fafc', fontSize: 25, fontWeight: '900', letterSpacing: 1.4, textShadowColor: 'rgba(139,92,246,0.48)', textShadowOffset: { width: 0, height: 0 }, textShadowRadius: 5 },"
          if old_style not in text:
              raise SystemExit('Stilul titlului nu a fost găsit; build oprit pentru siguranță.')
          text = text.replace(old_style, new_style, 1)
          app.write_text(text, encoding='utf-8')

          cfg_path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['expo']['version'] = '0.3.15'
          cfg['expo']['android']['versionCode'] = 25
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png
          file scalp-atlas-new/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v0.3.15-LAST-CANDLE-GUARD.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.3.15-LAST-CANDLE-GUARD
          path: ScalpAtlas-v0.3.15-LAST-CANDLE-GUARD.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-v0.3.15-test --cleanup-tag --yes || true
          gh release create scalp-atlas-v0.3.15-test \
            ScalpAtlas-v0.3.15-LAST-CANDLE-GUARD.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS v0.3.15 Last Candle Guard" \
            --notes "Corecție după testul CHF/JPY OTC M10: un canal ascendent nu mai emite BUY când ultima zonă cade brusc, iar un canal descendent nu mai emite SELL când ultima zonă urcă brusc. Se verifică separat ultimele 1–3 segmente și impulsul ultra-recent. O contramișcare puternică produce AȘTEAPTĂ CONFIRMAREA chiar dacă scorul brut depășește 72%. Filtrul v0.3.14, timerul și săgeata rămân active." \
            --prerelease
