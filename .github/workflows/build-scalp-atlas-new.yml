name: Build SCALP ATLAS Premium 19.99 APK

on:
  push:
    branches: [diagnostic-v027]
    paths:
      - 'scalp-atlas-new/**'
      - '.github/workflows/build-scalp-atlas-new.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalp-atlas-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.11 monthly price, persistent trial and safe IAP check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('scalp-atlas-new/App.tsx')
          text = app.read_text(encoding='utf-8')

          if "@react-native-async-storage/async-storage" not in text:
              text = text.replace(
                  "import { StatusBar } from 'expo-status-bar';",
                  "import AsyncStorage from '@react-native-async-storage/async-storage';\nimport { StatusBar } from 'expo-status-bar';",
                  1,
              )

          text = text.replace(
              "const FREE_ANALYSIS_LIMIT = 5;",
              "const FREE_ANALYSIS_LIMIT = 5;\nconst TRIAL_STORAGE_KEY = 'scalp_atlas_free_analyses_used_v1';\nconst MONTHLY_PRODUCT_ID = 'com.scalpatlas.app.premium.monthly';\nconst ANNUAL_PRODUCT_ID = 'com.scalpatlas.app.premium.annual';",
              1,
          )

          old_title = '<Text style={styles.logo}>SCALP ATLAS</Text>'
          new_title = "<Text style={styles.logo}><Text style={{ color: '#20E0FF' }}>SC</Text><Text style={{ color: '#28BFFF' }}>AL</Text><Text style={{ color: '#557FFF' }}>P </Text><Text style={{ color: '#8758FF' }}>AT</Text><Text style={{ color: '#C43AF2' }}>LA</Text><Text style={{ color: '#FF2DB8' }}>S</Text></Text>"
          if old_title in text:
              text = text.replace(old_title, new_title, 1)
          old_style = "logo: { color: '#f7fafc', fontSize: 25, fontWeight: '900', letterSpacing: 1.4 },"
          new_style = "logo: { color: '#f7fafc', fontSize: 25, fontWeight: '900', letterSpacing: 1.4, textShadowColor: 'rgba(139,92,246,0.48)', textShadowOffset: { width: 0, height: 0 }, textShadowRadius: 5 },"
          if old_style in text:
              text = text.replace(old_style, new_style, 1)

          state_anchor = "  const [freeAnalysesUsed, setFreeAnalysesUsed] = useState(0);"
          if "trialLoaded" not in text:
              text = text.replace(
                  state_anchor,
                  state_anchor + "\n  const [trialLoaded, setTrialLoaded] = useState(false);\n  const [selectedPlan, setSelectedPlan] = useState<'monthly' | 'annual' | null>('monthly');\n  const [billingBusy, setBillingBusy] = useState(false);\n  const [monthlyPrice, setMonthlyPrice] = useState<string | null>('19,99 € / lună');\n  const [annualPrice, setAnnualPrice] = useState<string | null>(null);",
                  1,
              )

          ref_anchor = "  const analyzerRef = useRef<WebView>(null);"
          if "analysisInFlightRef" not in text:
              text = text.replace(ref_anchor, ref_anchor + "\n  const analysisInFlightRef = useRef(false);", 1)

          if "AsyncStorage.getItem(TRIAL_STORAGE_KEY)" not in text:
              persistence = "\n\n  useEffect(() => {\n    let mounted = true;\n    AsyncStorage.getItem(TRIAL_STORAGE_KEY)\n      .then((stored) => {\n        if (!mounted) return;\n        const parsed = stored == null ? 0 : Number.parseInt(stored, 10);\n        const safeValue = Number.isFinite(parsed) ? Math.max(0, Math.min(FREE_ANALYSIS_LIMIT, parsed)) : 0;\n        setFreeAnalysesUsed(safeValue);\n      })\n      .catch(() => {\n        if (mounted) setFreeAnalysesUsed(0);\n      })\n      .finally(() => {\n        if (mounted) setTrialLoaded(true);\n      });\n    return () => { mounted = false; };\n  }, []);\n"
              text = text.replace("  const analysisInFlightRef = useRef(false);", "  const analysisInFlightRef = useRef(false);" + persistence, 1)

          analyze_start = "  const analyzeImage = () => {\n    if (trialLocked) {"
          analyze_ready = "  const analyzeImage = () => {\n    if (!trialLoaded) {\n      setMessage('Se încarcă starea testului gratuit. Încearcă din nou imediat.');\n      return;\n    }\n    if (trialLocked) {"
          if analyze_start in text:
              text = text.replace(analyze_start, analyze_ready, 1)

          analyze_anchor = "    setBusy(true);\n    setAnalysis(null);\n    setRemainingSeconds(0);\n    setMessage(`Analizez fotografia cu atlasul de ${SCALP_ATLAS_COUNT} modele…`);"
          analyze_guard = "    if (analysisInFlightRef.current) return;\n    analysisInFlightRef.current = true;\n    setBusy(true);\n    setAnalysis(null);\n    setRemainingSeconds(0);\n    setMessage(`Analizez fotografia cu atlasul de ${SCALP_ATLAS_COUNT} modele…`);"
          if analyze_anchor in text:
              text = text.replace(analyze_anchor, analyze_guard, 1)

          result_anchor = "      if (payload.type === 'RESULT') {\n        const result = payload.result as AnalysisResult;"
          result_guard = "      if (payload.type === 'RESULT') {\n        if (!analysisInFlightRef.current) return;\n        analysisInFlightRef.current = false;\n        const result = payload.result as AnalysisResult;"
          if result_anchor in text:
              text = text.replace(result_anchor, result_guard, 1)

          old_increment = "        setFreeAnalysesUsed((used) => Math.min(FREE_ANALYSIS_LIMIT, used + 1));"
          new_increment = "        setFreeAnalysesUsed((used) => {\n          const next = Math.min(FREE_ANALYSIS_LIMIT, used + 1);\n          AsyncStorage.setItem(TRIAL_STORAGE_KEY, String(next)).catch(() => {});\n          return next;\n        });"
          if old_increment in text:
              text = text.replace(old_increment, new_increment, 1)

          error_anchor = "      if (payload.type === 'ERROR') {\n        setBusy(false);"
          error_guard = "      if (payload.type === 'ERROR') {\n        analysisInFlightRef.current = false;\n        setBusy(false);"
          if error_anchor in text:
              text = text.replace(error_anchor, error_guard, 1)

          catch_anchor = "    } catch {\n      setBusy(false);\n      setRemainingSeconds(0);\n      setMessage('Motorul Atlas a trimis un rezultat invalid.');"
          catch_guard = "    } catch {\n      analysisInFlightRef.current = false;\n      setBusy(false);\n      setRemainingSeconds(0);\n      setMessage('Motorul Atlas a trimis un rezultat invalid.');"
          if catch_anchor in text:
              text = text.replace(catch_anchor, catch_guard, 1)

          if "const checkStoreBilling = async () =>" not in text:
              billing_fn = "\n\n  const checkStoreBilling = async () => {\n    if (!selectedPlan || billingBusy) return;\n    if (Platform.OS !== 'android') {\n      setMessage('Acest APK testează Google Play Billing pe Android.');\n      return;\n    }\n    const productId = selectedPlan === 'monthly' ? MONTHLY_PRODUCT_ID : ANNUAL_PRODUCT_ID;\n    setBillingBusy(true);\n    setMessage('Conectez SCALP ATLAS la Google Play Billing…');\n    let cleanup: null | (() => Promise<void>) = null;\n    try {\n      const iap = await import('expo-iap');\n      cleanup = iap.endConnection;\n      const connected = await iap.initConnection();\n      if (!connected) throw new Error('Conexiunea cu Google Play nu a putut fi inițializată.');\n      const products = await iap.fetchProducts({ skus: [productId], type: 'subs' });\n      const product = products?.[0] as any;\n      if (product) {\n        const price = product.displayPrice || product.localizedPrice || product.price || (selectedPlan === 'monthly' ? '19,99 € / lună' : 'Preț neconfirmat');\n        if (selectedPlan === 'monthly') setMonthlyPrice(String(price));\n        else setAnnualPrice(String(price));\n        setMessage(`Google Play Billing este conectat. Plan ${selectedPlan === 'monthly' ? 'LUNAR' : 'ANUAL'} detectat: ${price}. Nu s-a inițiat nicio plată.`);\n      } else {\n        setMessage('Google Play Billing s-a încărcat fără să închidă aplicația. Produsul nu este încă disponibil pentru acest APK instalat direct; următorul test se face prin Google Play Internal Testing.');\n      }\n    } catch (error) {\n      const detail = error instanceof Error ? error.message : String(error);\n      setMessage(`Modulul de plată a răspuns fără crash: ${detail}. Pentru produse reale este necesară distribuirea prin Google Play Internal Testing.`);\n    } finally {\n      if (cleanup) {\n        try { await cleanup(); } catch {}\n      }\n      setBillingBusy(false);\n    }\n  };\n"
              text = text.replace("  const onAnalyzerMessage = (event: WebViewMessageEvent) => {", billing_fn + "\n  const onAnalyzerMessage = (event: WebViewMessageEvent) => {", 1)

          text = text.replace("          disabled={!image || busy || trialLocked}", "          disabled={!image || busy || trialLocked || !trialLoaded}", 1)
          text = text.replace("          style={[styles.analyzeButton, (!image || busy || trialLocked) && styles.analyzeButtonDisabled]}", "          style={[styles.analyzeButton, (!image || busy || trialLocked || !trialLoaded) && styles.analyzeButtonDisabled]}", 1)

          paywall_anchor = "        </Pressable>\n\n        <View style={styles.statusCard}>"
          if "SCALP ATLAS PREMIUM" not in text:
              paywall_block = (
                  "        </Pressable>\n\n"
                  "        {trialLocked && (\n"
                  "          <View style={styles.paywallCard}>\n"
                  "            <Text style={styles.paywallEyebrow}>SCALP ATLAS PREMIUM</Text>\n"
                  "            <Text style={styles.paywallTitle}>Continuă analizele cu abonament</Text>\n"
                  "            <Text style={styles.paywallText}>Ai folosit cele 5 analize gratuite. Alege planul dorit pentru acces complet.</Text>\n"
                  "            <View style={styles.planRow}>\n"
                  "              <Pressable onPress={() => { setSelectedPlan('monthly'); setMessage('Plan LUNAR selectat. Poți verifica legătura cu Google Play.'); }} style={[styles.planButton, selectedPlan === 'monthly' && styles.planButtonSelected]}>\n"
                  "                {selectedPlan === 'monthly' && <Text style={styles.planSelected}>SELECTAT</Text>}\n"
                  "                <Text style={styles.planTitle}>LUNAR</Text>\n"
                  "                <Text style={styles.planPrice}>{monthlyPrice || '19,99 € / lună'}</Text>\n"
                  "              </Pressable>\n"
                  "              <Pressable onPress={() => { setSelectedPlan('annual'); setMessage('Plan ANUAL selectat. Poți verifica legătura cu Google Play.'); }} style={[styles.planButton, styles.planButtonFeatured, selectedPlan === 'annual' && styles.planButtonSelected]}>\n"
                  "                <Text style={styles.planBadge}>RECOMANDAT</Text>\n"
                  "                {selectedPlan === 'annual' && <Text style={styles.planSelected}>SELECTAT</Text>}\n"
                  "                <Text style={styles.planTitle}>ANUAL</Text>\n"
                  "                <Text style={styles.planPrice}>{annualPrice || 'Preț în magazin'}</Text>\n"
                  "              </Pressable>\n"
                  "            </View>\n"
                  "            <Text style={styles.selectedPlanText}>{selectedPlan === 'monthly' ? 'Plan selectat: LUNAR' : selectedPlan === 'annual' ? 'Plan selectat: ANUAL' : 'Alege LUNAR sau ANUAL.'}</Text>\n"
                  "            <Pressable disabled={!selectedPlan || billingBusy} onPress={checkStoreBilling} style={[styles.checkoutButton, (!selectedPlan || billingBusy) && styles.checkoutButtonDisabled]}>\n"
                  "              <Text style={styles.checkoutButtonText}>{billingBusy ? 'CONECTEZ GOOGLE PLAY…' : selectedPlan ? 'CONTINUĂ LA PLATĂ' : 'ALEGE UN PLAN'}</Text>\n"
                  "            </Pressable>\n"
                  "            <Text style={styles.paywallNote}>Test sigur: verifică Google Play Billing și produsul selectat. Nu inițiază încă requestPurchase și nu poate retrage bani.</Text>\n"
                  "          </View>\n"
                  "        )}\n\n"
                  "        <View style={styles.statusCard}>"
              )
              text = text.replace(paywall_anchor, paywall_block, 1)

          style_anchor = "  statusCard: { backgroundColor: '#0c121c', borderRadius: 14, borderWidth: 1, borderColor: '#1f2937', padding: 14, gap: 7 },"
          if "paywallCard:" not in text:
              paywall_styles = (
                  "  paywallCard: { backgroundColor: '#0b1220', borderRadius: 16, borderWidth: 1, borderColor: '#6d45d9', padding: 16, gap: 10 },\n"
                  "  paywallEyebrow: { color: '#bd8cff', fontSize: 11, fontWeight: '900', letterSpacing: 1.1 },\n"
                  "  paywallTitle: { color: '#f5f7fb', fontSize: 20, fontWeight: '900' },\n"
                  "  paywallText: { color: '#9aa8ba', fontSize: 13, lineHeight: 19 },\n"
                  "  planRow: { flexDirection: 'row', gap: 10 },\n"
                  "  planButton: { flex: 1, minHeight: 94, borderRadius: 13, borderWidth: 1, borderColor: '#344158', backgroundColor: '#101827', padding: 12, justifyContent: 'center', alignItems: 'center', gap: 5 },\n"
                  "  planButtonFeatured: { borderColor: '#9b62ff', backgroundColor: '#17112a' },\n"
                  "  planButtonSelected: { borderColor: '#20e0ff', borderWidth: 2, backgroundColor: '#102033' },\n"
                  "  planBadge: { color: '#d5b7ff', fontSize: 9, fontWeight: '900', letterSpacing: 0.8 },\n"
                  "  planSelected: { color: '#20e0ff', fontSize: 9, fontWeight: '900', letterSpacing: 0.8 },\n"
                  "  planTitle: { color: '#f4f7fb', fontSize: 15, fontWeight: '900', letterSpacing: 0.7 },\n"
                  "  planPrice: { color: '#8795aa', fontSize: 11 },\n"
                  "  selectedPlanText: { color: '#cbd5e1', fontSize: 11, fontWeight: '700', textAlign: 'center' },\n"
                  "  checkoutButton: { minHeight: 52, borderRadius: 13, backgroundColor: '#5b32d6', alignItems: 'center', justifyContent: 'center', paddingHorizontal: 14, marginTop: 2 },\n"
                  "  checkoutButtonDisabled: { opacity: 0.38, backgroundColor: '#273247' },\n"
                  "  checkoutButtonText: { color: '#ffffff', fontSize: 13, fontWeight: '900', letterSpacing: 0.8 },\n"
                  "  paywallNote: { color: '#6f7d90', fontSize: 10, lineHeight: 15, textAlign: 'center' },\n"
                  + style_anchor
              )
              text = text.replace(style_anchor, paywall_styles, 1)

          app.write_text(text, encoding='utf-8')

          engine = Path('scalp-atlas-new/analysisEngine.ts')
          eng = engine.read_text(encoding='utf-8')
          eng = eng.replace("const ENGINE_VERSION='0.2.3';", "const ENGINE_VERSION='0.2.4';", 1)
          tf_anchor = "  const TF_MIN={M1:1,M2:2,M3:3,M5:5,M10:10,M15:15,M30:30,H1:60};"
          if "let analysisRunning=false;" not in eng:
              eng = eng.replace(tf_anchor, tf_anchor + "\n  let analysisRunning=false;", 1)
          old_send = "  function send(payload){try{window.ReactNativeWebView.postMessage(JSON.stringify(payload));}catch(e){}}"
          new_send = "  function send(payload){if(payload&&(payload.type==='RESULT'||payload.type==='ERROR'))analysisRunning=false;try{window.ReactNativeWebView.postMessage(JSON.stringify(payload));}catch(e){}}"
          if old_send in eng:
              eng = eng.replace(old_send, new_send, 1)
          old_msg = "      if(msg.type==='ANALYZE'&&msg.dataUrl)run(msg.dataUrl,msg.timeframe||'M15');"
          new_msg = "      if(msg.type==='ANALYZE'&&msg.dataUrl&&!analysisRunning){analysisRunning=true;run(msg.dataUrl,msg.timeframe||'M15');}"
          if old_msg in eng:
              eng = eng.replace(old_msg, new_msg, 1)
          engine.write_text(eng, encoding='utf-8')

          pkg_path = Path('scalp-atlas-new/package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = '0.3.10'
          pkg.setdefault('dependencies', {})['expo-iap'] = '5.5.1'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cfg_path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['expo']['version'] = '0.3.10'
          cfg['expo']['android']['versionCode'] = 19
          plugins = cfg['expo'].setdefault('plugins', [])
          if 'expo-iap' not in plugins:
              plugins.insert(0, 'expo-iap')
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Generate launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v0.3.11-PREMIUM-19-99-FIX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.3.11-PREMIUM-19-99-FIX
          path: ScalpAtlas-v0.3.11-PREMIUM-19-99-FIX.apk
          if-no-files-found: error
