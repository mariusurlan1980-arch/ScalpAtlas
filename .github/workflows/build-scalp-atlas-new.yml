name: Build SCALP ATLAS Standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'scalp-atlas-new/**'
      - '.github/workflows/build-scalp-atlas-new.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png
          file scalp-atlas-new/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v0.2.3-BUY-SELL-FIX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.2.3-BUY-SELL-FIX
          path: ScalpAtlas-v0.2.3-BUY-SELL-FIX.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-v0.2.3-test --cleanup-tag --yes || true
          gh release create scalp-atlas-v0.2.3-test \
            ScalpAtlas-v0.2.3-BUY-SELL-FIX.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS v0.2.3 Test" \
            --notes "Test build: corecție pentru bias-ul BUY. Motorul poate returna BUY, SELL sau FĂRĂ SEMNAL CLAR, în funcție de fotografia analizată." \
            --prerelease
