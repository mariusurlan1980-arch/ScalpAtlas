name: Build SCALP ATLAS Standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'scalp-atlas-new/**'
      - '.github/workflows/build-scalp-atlas-new.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Normalize launcher icon
        run: |
          set -e
          ICON="scalp-atlas-new/assets/app-icon.png"
          TMP="scalp-atlas-new/assets/app-icon-normalized.png"
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i "$ICON" -vf scale=512:512 -pix_fmt rgb24 "$TMP"
          elif command -v convert >/dev/null 2>&1; then
            convert "$ICON" -resize 512x512! -alpha off -colorspace sRGB "$TMP"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            convert "$ICON" -resize 512x512! -alpha off -colorspace sRGB "$TMP"
          fi
          mv "$TMP" "$ICON"

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-New-Standalone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-New-Standalone-APK
          path: ScalpAtlas-New-Standalone.apk
          if-no-files-found: error
