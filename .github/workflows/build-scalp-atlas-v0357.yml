name: Build SCALP ATLAS v0.3.57 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scalp-atlas-v0357.yml'
      - '.github/scripts/patch_scalp_atlas_v0357.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply all Scalp Atlas patches through v0.3.57
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            echo "Applying $f"
            python3 "$f"
          done

      - name: Force ANALIZĂ label and Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('scalp-atlas-new/App.tsx')
          text = app.read_text(encoding='utf-8')

          # Siguranță finală: orice variantă veche a textului este eliminată.
          text = text.replace('ANALIZEAZĂ CU 70 MODELE', 'ANALIZĂ')
          text = text.replace('ANALIZEAZĂ CU ${SCALP_ATLAS_COUNT} MODELE', 'ANALIZĂ')
          app.write_text(text, encoding='utf-8')

          cfg_path = Path('scalp-atlas-new/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['expo']['version'] = '0.3.57'
          cfg['expo']['android']['versionCode'] = 67
          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: npm install

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-new/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-new/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-v0.3.57-ANALIZA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.3.57-ANALIZA
          path: ScalpAtlas-v0.3.57-ANALIZA.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-v0.3.57-test --cleanup-tag --yes || true
          gh release create scalp-atlas-v0.3.57-test \
            ScalpAtlas-v0.3.57-ANALIZA.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS v0.3.57 ANALIZĂ" \
            --notes "Butonul principal afișează exclusiv ANALIZĂ. Textul ANALIZEAZĂ CU 70 MODELE este eliminat. Motorul și atlasul de 70 modele rămân neschimbate." \
            --prerelease
