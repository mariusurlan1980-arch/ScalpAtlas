name: Build SCALP ATLAS LIVE v0.1 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scalp-atlas-live-v01.yml'
      - '.github/templates/ScalpAtlasLiveApp.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply current Scalp Atlas engine patches
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            echo "Applying $f"
            python3 "$f"
          done

      - name: Create separate Scalp Atlas Live project
        run: |
          set -e
          rm -rf scalp-atlas-live
          cp -R scalp-atlas-new scalp-atlas-live
          cp .github/templates/ScalpAtlasLiveApp.tsx scalp-atlas-live/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          import json

          cfg_path = Path('scalp-atlas-live/app.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          expo = cfg['expo']
          expo['name'] = 'Scalp Atlas Live'
          expo['slug'] = 'scalp-atlas-live'
          expo['version'] = '0.1.0'
          expo['android']['package'] = 'com.scalpatlas.live'
          expo['android']['versionCode'] = 1

          plugins = expo.get('plugins', [])
          if 'expo-camera' not in plugins:
              plugins.append([
                  'expo-camera',
                  {
                      'cameraPermission': 'Permite Scalp Atlas Live să folosească camera pentru urmărirea graficului de pe al doilea dispozitiv.'
                  }
              ])
          expo['plugins'] = plugins

          cfg_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install base dependencies
        working-directory: scalp-atlas-live
        run: npm install

      - name: Install compatible Expo Camera
        working-directory: scalp-atlas-live
        run: npx expo install expo-camera

      - name: Generate clean launcher icon
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 scalp-atlas-live/assets/app-icon.svg -o scalp-atlas-live/assets/app-icon.png

      - name: Generate Android project
        working-directory: scalp-atlas-live
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: scalp-atlas-live/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp scalp-atlas-live/android/app/build/outputs/apk/release/app-release.apk ScalpAtlas-Live-v0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-Live-v0.1
          path: ScalpAtlas-Live-v0.1.apk
          if-no-files-found: error

      - name: Publish test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scalp-atlas-live-v0.1-test --cleanup-tag --yes || true
          gh release create scalp-atlas-live-v0.1-test \
            ScalpAtlas-Live-v0.1.apk \
            --target "$GITHUB_SHA" \
            --title "SCALP ATLAS LIVE v0.1" \
            --notes "Proiect separat de aplicația stabilă. Camera rămâne deschisă, utilizatorul încadrează graficul de pe al doilea dispozitiv, blochează cadrul și pornește LIVE. Motorul Atlas reanalizează aproximativ la 3 secunde și afișează BUY, SELL, WAIT, scor, model și expirare." \
            --prerelease
