name: Verify OHLC research engine
on:
  pull_request:
    branches: [main]
    paths:
      - 'scalp-atlas-new/ohlcReversalEngine.js'
      - 'scalp-atlas-new/ohlcReversalEngine.test.js'
      - 'scalp-atlas-new/OHLC_RESEARCH.md'
      - '.github/workflows/verify-ohlc-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deterministic reversal cases
        run: node --test scalp-atlas-new/ohlcReversalEngine.test.js
