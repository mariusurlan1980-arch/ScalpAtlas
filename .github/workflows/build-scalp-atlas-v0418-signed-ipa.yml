name: Build SCALP ATLAS v0.4.18 Signed IPA

on:
  workflow_dispatch:
    inputs:
      distribution_method:
        description: 'iOS distribution method'
        required: true
        default: 'app-store-connect'
        type: choice
        options:
          - app-store-connect
          - ad-hoc

permissions:
  contents: read

jobs:
  build-signed-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Apple signing secrets
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "Missing Apple signing secrets."
            echo "Required: APPLE_P12_BASE64, APPLE_P12_PASSWORD, APPLE_MOBILEPROVISION_BASE64"
            exit 1
          fi

      - name: Apply stable Scalp Atlas patches
        run: |
          set -e
          for f in $(ls .github/scripts/patch_scalp_atlas_v03*.py | sort -V); do
            python3 "$f"
          done

      - name: Integrate v0.4.18 sources
        run: |
          set -e
          cp .github/templates/ScalpAtlasIntegratedLiveV0418.tsx scalp-atlas-new/LiveAnalysisApp.tsx
          cp .github/templates/ScalpAtlasLocalizationV0418.ts scalp-atlas-new/localization.ts
          cp .github/templates/ScalpAtlasAnalysisEngineV0416.ts scalp-atlas-new/analysisEngine.ts
          cp .github/templates/ScalpAtlasIntegratedAppV042.tsx scalp-atlas-new/App.tsx
          cp .github/templates/ScalpAtlasOcrAdapterV0416.ts scalp-atlas-new/ocrAdapter.ts
          cp .github/templates/ScalpAtlasOcrAdapterV0416.native.ts scalp-atlas-new/ocrAdapter.native.ts
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.tsx scalp-atlas-new/AnalyzerBridge.tsx
          cp .github/templates/ScalpAtlasAnalyzerBridgeV0416.native.tsx scalp-atlas-new/AnalyzerBridge.native.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('scalp-atlas-new/app.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          expo=cfg['expo']
          expo['name']='SCALP ATLAS'
          expo['slug']='scalp-atlas'
          expo['version']='0.4.18'
          expo['orientation']='default'
          expo['ios']['bundleIdentifier']='com.scalpatlas.app'
          expo['ios']['supportsTablet']=True
          supported=['ro','en','de','es','fr','it','pt','nl','pl','uk','ru','tr','el','hu','cs','sk','bg','sr','hr','sl','ar','he','zh','ja','ko','hi']
          plugins=expo.setdefault('plugins',[])
          plugins[:]=[x for x in plugins if not (x=='expo-localization' or (isinstance(x,list) and x and x[0]=='expo-localization'))]
          plugins.append(['expo-localization',{'supportedLocales':{'ios':supported,'android':supported},'supportsRTL':True,'forcesRTL':False}])
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scalp-atlas-new
        run: |
          npm install
          npx expo install expo-camera expo-audio expo-haptics expo-localization @react-native-async-storage/async-storage
          npm install tesseract.js

      - name: TypeScript check
        working-directory: scalp-atlas-new
        run: npx tsc --noEmit

      - name: Generate Bip 1 audio assets
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import math, struct, wave
          assets=Path('scalp-atlas-new/assets')
          assets.mkdir(parents=True, exist_ok=True)
          rate=44100
          duration=1.4
          freq=880.0
          amp=0.28
          frames=bytearray()
          total=int(rate*duration)
          for i in range(total):
              t=i/rate
              fade=min(1.0, t/0.01, (duration-t)/0.03)
              sample=int(32767*amp*max(0.0,fade)*math.sin(2*math.pi*freq*t))
              frames += struct.pack('<h', sample)
          for name in ('buy-alert.wav','sell-alert.wav'):
              with wave.open(str(assets/name),'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(rate)
                  w.writeframes(frames)
          PY

      - name: Generate clean iOS icon
        run: |
          set -e
          brew install librsvg
          rsvg-convert -w 1024 -h 1024 scalp-atlas-new/assets/app-icon.svg -o scalp-atlas-new/assets/app-icon.png

      - name: Generate iOS project
        working-directory: scalp-atlas-new
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: scalp-atlas-new
        run: npx pod-install ios

      - name: Install Apple certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/scalpatlas-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/scalpatlas.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/scalpatlas-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import plistlib, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'profile.plist')
          with open(p,'rb') as f: d=plistlib.load(f)
          ent=d.get('Entitlements',{})
          appid=str(ent.get('application-identifier',''))
          bundle=appid.split('.',1)[1] if '.' in appid else ''
          teams=d.get('TeamIdentifier') or []
          team=(teams[0] if teams else ent.get('com.apple.developer.team-identifier',''))
          print(f"PROFILE_UUID={d.get('UUID','')}")
          print(f"PROFILE_NAME={d.get('Name','')}")
          print(f"APPLE_TEAM_ID={team}")
          print(f"PROFILE_BUNDLE_ID={bundle}")
          PY

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist").mobileprovision"

      - name: Validate profile matches Scalp Atlas
        run: |
          set -e
          echo "Profile: $PROFILE_NAME"
          echo "Team: $APPLE_TEAM_ID"
          echo "Bundle: $PROFILE_BUNDLE_ID"
          if [ "$PROFILE_BUNDLE_ID" != "com.scalpatlas.app" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "Provisioning profile does not match com.scalpatlas.app"
            exit 1
          fi
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "Could not read Apple team/profile metadata"
            exit 1
          fi

      - name: Archive signed iPhone iPad app
        working-directory: scalp-atlas-new/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found"
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          AVAILABLE=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print('\\n'.join(d.get('workspace',{}).get('schemes',[])))")
          if ! printf '%s\n' "$AVAILABLE" | grep -Fxq "$SCHEME"; then
            SCHEME=$(printf '%s\n' "$AVAILABLE" | grep -E '^SCALP|^Scalp|^scalp' | head -n 1)
          fi
          if [ -z "$SCHEME" ]; then
            echo "Main Xcode scheme not found"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScalpAtlas.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create ExportOptions.plist
        env:
          METHOD: ${{ inputs.distribution_method }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.scalpatlas.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ScalpAtlas.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA=$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA" ]; then
            echo "Signed IPA was not created"
            exit 1
          fi
          cp "$IPA" "ScalpAtlas-v0.4.18-SIGNED.ipa"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScalpAtlas-v0.4.18-SIGNED-IPA
          path: ScalpAtlas-v0.4.18-SIGNED.ipa
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/scalpatlas-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/scalpatlas-signing.p12" "$RUNNER_TEMP/scalpatlas.mobileprovision" "$RUNNER_TEMP/profile.plist"
