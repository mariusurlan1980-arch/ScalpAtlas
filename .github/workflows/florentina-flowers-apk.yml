name: Build Florentina Flowers APK

on:
  push:
    branches:
      - florentina-flowers-android
    paths:
      - 'florentina-flowers/**'
      - '.github/workflows/florentina-flowers-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: florentina-flowers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FlorentinaFlowers-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlorentinaFlowers-APK
          path: florentina-flowers/FlorentinaFlowers-v0.4.apk
          if-no-files-found: error
