<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07192a">
<title>Flory Partners</title>
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">FF</div>
      <div><h1>Flory Partners</h1><p>Portal pentru florării partenere</p></div>
    </div>
    <button id="logout" class="ghost hidden">Ieșire</button>
  </header>
  <main>
    <section id="loginView" class="card login">
      <h2>Acces florist</h2>
      <p class="muted">Intră cu adresa de email a florăriei și codul primit de la Flory Flowers.</p>
      <label>Email<input id="email" type="email" autocomplete="email" placeholder="florist@exemplu.com"></label>
      <label>Cod partener<input id="partnerCode" type="password" autocomplete="one-time-code" placeholder="Cod partener"></label>
      <button id="loginBtn" class="primary">Intră în portal</button>
      <p id="loginMsg" class="msg"></p>
    </section>
    <section id="dashboardView" class="hidden">
      <div class="welcome card">
        <div><span class="eyebrow">FLORĂRIE PARTENERĂ</span><h2 id="partnerName">Flory Partner</h2><p id="partnerArea" class="muted">Zonă de livrare</p></div>
        <div class="stat"><b id="openCount">0</b><span>comenzi active</span></div>
      </div>
      <div class="tabs"><button class="tab active" data-filter="active">Active</button><button class="tab" data-filter="delivered">Livrate</button><button class="tab" data-filter="all">Toate</button></div>
      <div id="orders" class="orders"></div>
    </section>
  </main>
  <div id="modal" class="modal hidden"><div class="sheet"><button id="closeModal" class="close">×</button><div id="modalBody"></div></div></div>
</div>
<script src="app.js?v=1"></script>
</body>
</html>
